<title>Upward Facing Thots</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,400;1,9..144,600&display=swap">
<style>
/* Layout: Scher-scale masthead, full-bleed color-block bands per book, spines on a plank. Walsh hard edges, no gradients. */
:root{
  --bg:#FFF4EE; --surface:#FFFFFF; --ink:#1B1210; --muted:#6B5650; --rule:#1B1210; --soft:#F6E2D8;
  --accent:#FF4F1F; --jess:#FF4F1F; --mandy:#2D4CF0; --bea:#D92D86;
  --ok:#0E7A4F; --warn:#C25A00; --late:#C8102E;
  --display:"Anton","Impact","Arial Narrow Bold",sans-serif;
  --serif:"Fraunces","Georgia",serif;
  --sans:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#16100E; --surface:#221915; --ink:#FBEDE6; --muted:#B59E95; --rule:#FBEDE6; --soft:#2E221D;
  --accent:#FF6A3D; --jess:#FF6A3D; --mandy:#7B8DFF; --bea:#FF6BB5;
  --ok:#4FD39A; --warn:#FFB061; --late:#FF6B7F; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#16100E; --surface:#221915; --ink:#FBEDE6; --muted:#B59E95; --rule:#FBEDE6; --soft:#2E221D;
  --accent:#FF6A3D; --jess:#FF6A3D; --mandy:#7B8DFF; --bea:#FF6BB5;
  --ok:#4FD39A; --warn:#FFB061; --late:#FF6B7F; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--sans);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.muted{color:var(--muted)}
h1,h2,h3{text-wrap:balance;margin:0}

/* ---------- masthead ---------- */
.mast{padding-block:20px 28px;border-bottom:3px solid var(--rule)}
.mast-top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--muted)}
.mast h1{font-family:var(--display);font-weight:400;font-size:clamp(68px,16.5vw,212px);line-height:.84;letter-spacing:-.01em;text-transform:uppercase;margin-top:14px;position:relative}
.mast h1 .l{display:block}
.mast h1 .thots{color:var(--accent)}
.mast h1 .club{position:absolute;right:0;bottom:.12em;font-family:var(--serif);font-style:italic;font-weight:400;text-transform:none;font-size:clamp(22px,4.2vw,54px);letter-spacing:0;line-height:1;color:var(--ink);transform:rotate(-6deg);background:var(--bg);padding:0 .25em}
.mast-bottom{display:flex;justify-content:space-between;align-items:end;gap:18px;flex-wrap:wrap;margin-top:18px}
.kicker{font-family:var(--serif);font-size:clamp(20px,2.6vw,30px);margin:0;line-height:1.2}
.kicker em{font-weight:400;color:var(--muted)}
.pose{margin-top:6px;color:var(--muted)}
.me{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip-m{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--rule);background:transparent;border-radius:999px;padding:6px 14px 6px 6px;cursor:pointer;font-weight:700}
.chip-m .av{width:26px;height:26px}
.chip-m[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.me.ask .chip-m{animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{50%{transform:translateY(-3px)}}
.av{display:inline-grid;place-items:center;border-radius:50%;color:#fff;font-weight:700;font-size:12px;flex:none;width:24px;height:24px}
.av.Jess{background:var(--jess)} .av.Mandy{background:var(--mandy)} .av.Beatriz{background:var(--bea)}

/* ---------- buttons & inputs ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;border:2px solid currentColor;background:transparent;padding:10px 18px;font-weight:700;cursor:pointer;text-decoration:none;border-radius:0;line-height:1.1}
.btn.solid{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.small{padding:6px 12px;font-size:14px}
.btn:hover{transform:translate(-2px,-2px);box-shadow:3px 3px 0 currentColor}
.btn:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none}
.link{background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;font-weight:500}
input[type=text],input[type=date],input[type=number],select,textarea{width:100%;background:var(--surface);border:2px solid var(--rule);padding:10px 12px;border-radius:0;min-width:0}
textarea{resize:vertical;min-height:70px}
label.f{display:grid;gap:6px;min-width:0}
label.f>span{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* ---------- status banner ---------- */
.banner{border-bottom:2px solid var(--rule);background:var(--soft)}
.banner .wrap{padding-block:8px;font-size:14px}

/* ---------- now reading band ---------- */
.band{color:var(--fa);background:var(--pa);border-bottom:3px solid var(--rule)}
.now{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);min-height:360px}
.now .left{padding-block:36px 32px;padding-right:28px;display:flex;flex-direction:column;gap:18px;min-width:0}
.now .right{background:var(--pb);color:var(--fb);padding:32px 28px;display:flex;flex-direction:column;justify-content:space-between;gap:20px;margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));min-width:0}
.now .t{font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:clamp(44px,7vw,96px);line-height:.9}
.now .by{font-family:var(--serif);font-style:italic;font-size:22px}
.now .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:auto}
.now .actions .btn.solid{background:var(--fa);color:var(--pa);border-color:var(--fa)}
.stat{border-top:2px solid currentColor;padding-top:8px}
.stat b{display:block;font-family:var(--display);font-weight:400;font-size:clamp(34px,4.6vw,56px);line-height:1;font-variant-numeric:tabular-nums}
.stat .s{font-size:14px}
.band-wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- sections ---------- */
section.sec{padding-block:44px 8px}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.sec-head h2{font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:clamp(40px,6vw,72px);line-height:.9}
.sec-head h2 em{font-family:var(--serif);font-weight:400;text-transform:none;font-size:.55em;color:var(--accent)}

/* ---------- shelf ---------- */
.shelf{display:flex;align-items:flex-end;gap:6px;overflow-x:auto;padding:24px 4px 0;min-height:320px}
.plank{height:16px;background:var(--rule);margin-top:0;box-shadow:0 10px 0 -4px var(--soft)}
.spine{flex:none;writing-mode:vertical-rl;transform:rotate(180deg);display:flex;justify-content:space-between;align-items:center;gap:14px;padding:16px 10px;border:2px solid var(--rule);border-bottom-width:2px;cursor:pointer;background:var(--pa);color:var(--fa);text-align:left;transition:transform .2s}
.spine:hover,.spine:focus-visible{transform:rotate(180deg) translateY(14px)}
.spine .st{font-family:var(--display);font-size:24px;line-height:1.05;text-transform:uppercase;font-weight:400;max-height:100%}
.spine .sa{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.spine .band2{display:block;width:100%;height:auto}
.spine .tag{font-family:var(--mono);font-size:10px;letter-spacing:.12em;background:var(--pb);color:var(--fb);padding:6px 3px}
.spine.lean{transform:rotate(186deg);transform-origin:bottom left;margin-left:14px}
.spine.add{background:transparent;color:var(--ink);border-style:dashed;justify-content:center;width:70px;height:240px}
.spine.add .st{font-size:22px}
.legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:18px;color:var(--muted)}

/* ---------- reminders list ---------- */
.rem{list-style:none;margin:0;padding:0;border-top:2px solid var(--rule)}
.rem li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--rule)}
.rem .bk{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.due{font-family:var(--mono);font-size:12px;letter-spacing:.04em;padding:3px 8px;border:1.5px solid currentColor;white-space:nowrap;font-variant-numeric:tabular-nums}
.due.late{color:var(--late)} .due.soon{color:var(--warn)} .due.ok{color:var(--muted)}
.check{width:26px;height:26px;border:2px solid var(--rule);background:transparent;cursor:pointer;display:grid;place-items:center;flex:none;padding:0}
.check[aria-checked="true"]{background:var(--ink);color:var(--bg)}
.check[aria-checked="false"] svg{opacity:0}
.check[aria-checked="false"]:hover svg{opacity:.35}
a{color:inherit}
.check svg{width:14px;height:14px}

/* ---------- add book ---------- */
.addbox{border:3px solid var(--rule);padding:22px;display:grid;gap:14px;background:var(--surface);margin-top:26px}
.addbox .row{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,.8fr);gap:12px}

/* ---------- book world ---------- */
.back{display:inline-block;margin-block:16px}
.hero{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);border-block:3px solid var(--rule)}
.hero .left{background:var(--pa);color:var(--fa);padding:34px max(16px,env(safe-area-inset-left,0px)) 30px;padding-left:max(16px,env(safe-area-inset-left,0px), calc((100vw - 1180px)/2 + 16px));display:flex;flex-direction:column;gap:14px;min-width:0}
.hero .right{background:var(--pb);color:var(--fb);padding:30px 28px;padding-right:max(16px,env(safe-area-inset-right,0px),calc((100vw - 1180px)/2 + 16px));display:flex;flex-direction:column;gap:18px;min-width:0}
.hero .t{font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:clamp(46px,8vw,118px);line-height:.88}
.hero .by{font-family:var(--serif);font-style:italic;font-size:24px}
.hero .blurb{max-width:52ch;font-size:17px}
.hero .num{font-family:var(--display);font-size:clamp(80px,12vw,160px);line-height:.8}
.hero .ctrls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:auto}
.hero select{width:auto;background:transparent;border-color:currentColor;color:inherit;font-weight:700}
.hero select option{color:#1B1210;background:#fff}
.hero .ctrls .btn{color:inherit}
.meter{display:grid;gap:8px}
.meter .row{display:grid;grid-template-columns:72px 1fr;align-items:center;gap:8px;font-weight:700;font-size:14px}
.dots{display:flex;gap:5px}
.dot{width:24px;height:24px;border-radius:50%;border:2px solid currentColor;background:transparent;cursor:pointer;padding:0;color:inherit}
.dot.on{background:currentColor}
.dot:disabled{cursor:default}
.avg{font-family:var(--display);font-size:44px;line-height:1}

.tabs{display:flex;gap:0;border-bottom:3px solid var(--rule);overflow-x:auto;margin-top:28px}
.tab{background:none;border:0;padding:14px 18px 12px;font-family:var(--display);font-size:24px;text-transform:uppercase;cursor:pointer;color:var(--muted);white-space:nowrap;border-bottom:6px solid transparent;margin-bottom:-3px}
.tab sup{font-family:var(--mono);font-size:12px;margin-left:4px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--pa-safe)}
.panel{padding-block:28px 60px}
.panel-intro{font-family:var(--serif);font-style:italic;font-size:20px;color:var(--muted);margin:0 0 22px;max-width:60ch}

/* questions */
.q{display:grid;grid-template-columns:64px minmax(0,1fr);gap:16px;padding-block:22px;border-top:2px solid var(--rule)}
.q .qn{font-family:var(--display);font-size:40px;line-height:1;color:var(--pa-safe)}
.q .qt{font-family:var(--serif);font-weight:600;font-size:clamp(19px,2vw,23px);line-height:1.3;margin:0 0 12px;max-width:62ch}
.answers{display:grid;gap:10px;margin-bottom:12px}
.ans{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start}
.ans p{margin:0;white-space:pre-wrap}
.ans .who{font-weight:700}
.reply{display:flex;gap:8px;align-items:flex-end}
.reply textarea{min-height:46px}

/* activities */
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:0;border-top:2px solid var(--rule);border-left:2px solid var(--rule)}
.act{border-right:2px solid var(--rule);border-bottom:2px solid var(--rule);padding:22px;display:flex;flex-direction:column;gap:10px;min-width:0;position:relative}
.act h3{font-family:var(--display);font-weight:400;font-size:28px;text-transform:uppercase;line-height:1}
.act p{margin:0}
.act .btn{align-self:flex-start;margin-top:auto}
.act.done{background:var(--soft)}
.stamp{position:absolute;top:16px;right:14px;font-family:var(--mono);font-size:11px;letter-spacing:.1em;border:2px solid var(--ok);color:var(--ok);padding:3px 7px;transform:rotate(6deg)}

/* notes */
.compose{border:3px solid var(--rule);background:var(--surface);padding:16px;display:grid;gap:12px;margin-bottom:28px}
.seg{display:inline-flex;border:2px solid var(--rule)}
.seg button{background:none;border:0;padding:7px 14px;cursor:pointer;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.compose .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.compose .row .pg{width:110px}
.wall{columns:3 260px;column-gap:18px}
.note{break-inside:avoid;margin-bottom:18px;background:var(--surface);border:2px solid var(--rule);border-top:10px solid var(--mc);padding:16px;display:grid;gap:10px}
.note .k{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.note p{margin:0;white-space:pre-wrap}
.note.quote p{font-family:var(--serif);font-style:italic;font-size:21px;line-height:1.35}
.note.hot p{font-weight:700;font-size:18px}
.note .foot{display:flex;align-items:center;gap:8px;font-size:14px}
.note .x{margin-left:auto;background:none;border:0;cursor:pointer;color:var(--muted);font-size:13px;text-decoration:underline}

/* goals */
.meet{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:12px;align-items:end;padding:18px;border:3px solid var(--rule);background:var(--surface);margin-bottom:26px}
.meet .cd{font-family:var(--display);font-size:34px;line-height:1;white-space:nowrap}
.goals{list-style:none;margin:0;padding:0;border-top:2px solid var(--rule)}
.goals li{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--rule)}
.goals li.done .gt{text-decoration:line-through;color:var(--muted)}
.goals .by{font-size:13px;color:var(--muted)}
.addline{display:grid;grid-template-columns:minmax(0,1fr) 170px auto;gap:10px;margin-top:18px;align-items:end}
.addq{display:flex;gap:10px;margin-top:20px;align-items:flex-end}
.empty{border:2px dashed var(--rule);padding:28px;display:grid;gap:12px;justify-items:start}
.empty h3{font-family:var(--display);font-weight:400;font-size:30px;text-transform:uppercase}
.confirm{display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(140%);background:var(--ink);color:var(--bg);padding:12px 20px;font-weight:700;transition:transform .25s;z-index:20;max-width:calc(100vw - 32px)}
#toast.show{transform:translateX(-50%) translateY(0)}
footer{border-top:3px solid var(--rule);padding-block:22px 40px;margin-top:40px;color:var(--muted)}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

@media (max-width:760px){
  .now{grid-template-columns:1fr}
  .now .left{padding-right:0}
  .now .right{margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .hero{grid-template-columns:1fr}
  .hero .right{padding-left:max(16px,env(safe-area-inset-left,0px))}
  .addbox .row,.meet,.addline{grid-template-columns:1fr}
  .goals li{grid-template-columns:auto minmax(0,1fr) auto}
  .goals li .by{display:none}
  .q{grid-template-columns:1fr;gap:4px}
  .mast h1 .club{position:static;display:inline-block;margin-top:8px}
  .tab{font-size:20px;padding:12px 12px 10px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

  <div class="mast-top mono"><span>Est. in the group chat · 3 members · 0 stretches</span><span id="today"></span></div>

    <div>
      <p class="kicker">Jess<em>,</em> Mandy <em>&amp;</em> Beatriz</p>

    <div class="me" id="me" role="group" aria-label="Who's reading?"></div>
  </div>
</header>

<main id="view" aria-live="polite"></main>

<footer><div class="wrap mono"><span>Upward Facing Thots · namaste &amp; annotate</span><span id="mode"></span></div></footer>

<script src="starter.js"></script>
<script>
(() => {
"use strict";
const MEMBERS = ["Jess","Mandy","Beatriz"];
const PALETTES = [
  ["#2D4CF0","#FFF4EC","#FF7A1A","#1A0E05"],
  ["#0E7A4F","#FFF1E6","#FFB3C7","#3B0A1E"],
  ["#C8102E","#FFF0E0","#FFE27A","#3A1A00"],
  ["#5B1A4A","#FFE8F3","#B9D7A8","#1E3315"],
  ["#FF4F1F","#1B0A04","#1B1210","#FF9E7A"],
];
const POSES = ["Downward Dog-Ear","Child's Pose, with a paperback","Warrior II (chapters, not sets)","Corpse Pose: fell asleep reading","Happy Baby: finished the book","Tree Pose: still rooted on page 1","Lotus Position, fully annotated","Cobra: reading the last page first","Seated Twist: plot twist","Bridge Pose: between books"];
const STATUS = {reading:"Reading now", next:"Up next", read:"Finished"};
const TABS = [["questions","Questions"],["activities","Activities"],["notes","Notes"],["goals","Goals"]];

const S = { books:{}, notes:{}, answers:{}, goals:{} };
let db = null, sample = null, mode = "loading", loaded = new Set();
let me = lsGet("uft-me") || "";
let tab = lsGet("uft-tab") || "questions";
let noteKind = "note";
let addOpen = false, confirmDel = false, building = null;
const drafts = {};

/* ---------- helpers ---------- */
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function $(s,r=document){ return r.querySelector(s); }
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"),2600); }
function todayISO(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function parseDay(s){ if(!s) return null; const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }
function fmtDay(s){ const d=parseDay(s); return d? d.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"}) : ""; }
function daysUntil(s){ const d=parseDay(s); if(!d) return null; const t=parseDay(todayISO()); return Math.round((d-t)/86400000); }
function dueChip(s){
  if(!s) return "";
  const n=daysUntil(s);
  const cls = n<0?"late":n<=3?"soon":"ok";
  const lbl = n<0?`${-n}d late`:n===0?"Today":n===1?"Tomorrow":fmtDay(s);
  return `<span class="due ${cls}">${esc(lbl)}</span>`;
}
function slug(s){ return (String(s).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,32) || "book") + "-" + Math.random().toString(36).slice(2,6); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function av(who){ return MEMBERS.includes(who)? `<span class="av ${who}" aria-hidden="true">${who[0]}</span>` : `<span class="av" style="background:var(--muted)">?</span>`; }
function memberVar(who){ return who==="Jess"?"var(--jess)":who==="Mandy"?"var(--mandy)":who==="Beatriz"?"var(--bea)":"var(--muted)"; }
function colors(b){ const c=Array.isArray(b.colors)&&b.colors.length===4? b.colors : PALETTES[0]; return `--pa:${c[0]};--fa:${c[1]};--pb:${c[2]};--fb:${c[3]};--pa-safe:${c[0]}`; }
const checkSVG = `<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 8.5l4 4 8-9" fill="none" stroke="currentColor" stroke-width="2.5"/></svg>`;

function booksSorted(){ return Object.values(S.books).sort((a,b)=>(a.order||0)-(b.order||0)); }
function current(){ const r=booksSorted().filter(b=>b.status==="reading"); return r[r.length-1] || null; }
function by(col,bookId){ return Object.values(S[col]).filter(x=>x.bookId===bookId); }

/* ---------- store adapter (shared db, or this-device fallback) ---------- */
const store = {
  async set(col,id,data){
    if(db){ await db.collection(col).doc(id).set(data); }
    else { S[col][id]={...data,id}; persistLocal(); render(); }
  },
  async update(col,id,patch){
    if(db){ await db.collection(col).doc(id).update(patch); }
    else { S[col][id]=deepMerge({...S[col][id]},patch); persistLocal(); render(); }
  },
  async del(col,id){
    if(db){ await db.collection(col).doc(id).delete(); }
    else { delete S[col][id]; persistLocal(); render(); }
  }
};
function deepMerge(t,p){ for(const k in p){ const v=p[k]; if(v && typeof v==="object" && !Array.isArray(v)){ t[k]=deepMerge({...(t[k]||{})},v); } else t[k]=v; } return t; }
function persistLocal(){ lsSet("uft-local", JSON.stringify(S)); }
async function safe(p, ok){
  try{ await p; if(ok) toast(ok); }
  catch(e){
    const c=e&&e.code;
    toast(c==="invalid_argument"? "You can read this shelf but not edit it. Ask Jess to invite you as an Editor." : c==="quota_exceeded"? "The shelf is full. Delete a few old notes to make room." : "That didn't save. Check your connection and try again.");
  }
}

async function boot(){
  $("#today").textContent = new Date().toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"});
  const day = Math.floor(Date.now()/86400000);
  $("#pose").textContent = "Today's pose: " + POSES[day % POSES.length];
  renderMe(); render();
  let api = null;
  try{ api = window.claude && window.claude.use ? await window.claude.use("db") : null; }catch(e){ api=null; }
  if(api){
    db = api; mode="shared";
    const timer = setTimeout(()=>{ if(loaded.size<4) setBanner("Still reaching the shared shelf. What you see may be out of date."); },10000);
    for(const col of ["books","notes","answers","goals"]){
      db.collection(col).onSnapshot(snap=>{
        const o={}; snap.docs.forEach(d=>{ o[d.id]={...d.data(),id:d.id}; });
        S[col]=o;
        if(!snap.metadata.fromCache){ loaded.add(col); if(loaded.size===4){ clearTimeout(timer); setBanner(""); } }
        else loaded.add(col);
        render();
      }, err=>{ clearTimeout(timer); setBanner(err.code==="revoked"? "This shelf is no longer shared with you." : "The shared shelf stopped updating. Reload to reconnect."); });
    }
  } else {
    mode="local";
    try{ const raw=lsGet("uft-local"); if(raw){ const o=JSON.parse(raw); for(const k of Object.keys(S)) S[k]=o[k]||{}; } }catch(e){}
    if(!Object.keys(S.books).length) seedLocal();
    setBanner("Saving on this device only. Open the shared link to read with Mandy and Beatriz.");
    loaded = new Set(["books","notes","answers","goals"]);
    render();
  }
  $("#mode").textContent = mode==="shared" ? "Synced for all three of you" : "Local copy";
  try{ sample = window.claude && window.claude.use ? await window.claude.use("sample") : null; }catch(e){ sample=null; }
  render();
}
function setBanner(t){ $("#banner").hidden=!t; $("#bannerText").textContent=t||""; }

/* Fallback starter shelf, used only when the shared store isn't available (e.g. opening index.html straight from the repo). */
function seedLocal(){
  const src = window.UFT_STARTER || [];
  src.forEach(b=>{ S.books[b.id]={...b}; });
  (window.UFT_STARTER_GOALS||[]).forEach(g=>{ S.goals[g.id]={...g}; });
  persistLocal();
}

/* ---------- me picker ---------- */
function renderMe(){
  const el=$("#me");
  el.classList.toggle("ask", !me);
  el.innerHTML = `<span class="mono muted">${me? "Reading as" : "Who's reading?"}</span>` + MEMBERS.map(m=>`<button class="chip-m" data-act="me" data-who="${m}" aria-pressed="${me===m}">${av(m)}${m}</button>`).join("");
}
function needMe(){ if(!me){ toast("Tap your name up top first."); $("#me").scrollIntoView({behavior:"smooth",block:"center"}); return true; } return false; }

/* ---------- render ---------- */
function render(){
  const a=document.activeElement, fid=a&&a.id, ss=a&&a.selectionStart, se=a&&a.selectionEnd;
  const route=location.hash.slice(1);
  const v=$("#view");
  if(route.startsWith("book-") && S.books[route.slice(5)]) v.innerHTML = bookView(S.books[route.slice(5)]);
  else if(route.startsWith("book-") && loaded.size<4) v.innerHTML = loadingView();
  else v.innerHTML = homeView();
  for(const id in drafts){ const el=document.getElementById(id); if(el && "value" in el) el.value=drafts[id]; }
  if(fid){ const el=document.getElementById(fid); if(el){ el.focus({preventScroll:true}); try{ if(ss!=null) el.setSelectionRange(ss,se); }catch(e){} } }
}
function loadingView(){ return `<div class="wrap"><section class="sec"><p class="panel-intro">Opening the shelf…</p></section></div>`; }

function homeView(){
  const books=booksSorted(), cur=current();
  if(mode==="loading" || (mode==="shared" && loaded.size<4 && !books.length)) return loadingView();
  return nowBand(cur) + `<div class="wrap">` + shelfSec(books) + remindersSec() + `</div>`;
}

function nowBand(b){
  if(!b) return `<div class="wrap"><section class="sec"><div class="empty"><h3>Nothing on the mat</h3><p>No book is marked “Reading now.” Add the next one to the shelf, or open a book and change its status.</p><button class="btn solid" data-act="openAdd">Add a book</button></div></section></div>`;
  const qs=b.questions||[], ans=by("answers",b.id), notes=by("notes",b.id), goals=by("goals",b.id);
  const open=goals.filter(g=>!g.done).sort(goalSort);
  const doneN=goals.filter(g=>g.done).length;
  const n=daysUntil(b.meetDate);
  const meet = b.meetDate ? (n<0? "Passed" : n===0? "Tonight" : n+"d") : "TBD";
  const meetSub = b.meetDate ? `${fmtDay(b.meetDate)}${b.meetPlace? " · "+esc(b.meetPlace):""}` : "No meetup date yet";
  const answered = new Set(ans.map(a=>a.q)).size;
  return `<div class="band" style="${colors(b)}"><div class="band-wrap now">
    <div class="left">
      <span class="mono">Now reading · Book Nº ${bookNo(b)}</span>
      <h2 class="t">${esc(b.title)}</h2>
      <div class="by">by ${esc(b.author)}</div>
      ${open[0]? `<div><span class="mono">Next goal</span><div style="font-size:19px;font-weight:700">${esc(open[0].text)} ${open[0].due? "· "+esc(fmtDay(open[0].due)):""}</div></div>`:""}
      <div class="actions">
        <a class="btn solid" href="#book-${esc(b.id)}">Enter this world →</a>
        <button class="btn" data-act="copy" data-id="${esc(b.id)}">Copy update for the chat</button>
      </div>
    </div>
    <div class="right">
      <div class="stat"><b>${esc(meet)}</b><span class="s">Meetup · ${meetSub}</span></div>
      <div class="stat"><b>${doneN}/${goals.length}</b><span class="s">Reading goals done</span></div>
      <div class="stat"><b>${answered}/${qs.length}</b><span class="s">Questions with answers · ${notes.length} notes</span></div>
    </div>
  </div></div>`;
}
function bookNo(b){ return booksSorted().findIndex(x=>x.id===b.id)+1; }

function shelfSec(books){
  const read=books.filter(b=>b.status==="read").length;
  const spines=books.map((b,i)=>{
    const h = 250 + ((b.title.length*7 + i*23) % 60);
    const L = b.title.length;
    const w = L>24 ? 92 : 62 + Math.round(L*0.9);
    const fs = L>24 ? 17 : L>14 ? 21 : 24;
    return `<button class="spine${b.status==="next"&&i===books.length-1?" lean":""}" style="${colors(b)};height:${h}px;width:${w}px" data-act="go" data-id="${esc(b.id)}" aria-label="${esc(b.title)} by ${esc(b.author)}, ${STATUS[b.status]||""}">
      <span class="sa">${esc(b.author)}</span><span class="st" style="font-size:${fs}px">${esc(b.title)}</span><span class="tag">${b.status==="reading"?"NOW":b.status==="next"?"NEXT":"READ"}</span></button>`;
  }).join("");
  return `<section class="sec" id="shelf">
    <div class="sec-head"><h2>The Shelf <em>everything we've read together</em></h2><span class="mono muted">${books.length} books · ${read} finished</span></div>
    <div class="shelf">${spines || `<p class="muted">The shelf is empty. Add the first book.</p>`}
      <button class="spine add" data-act="openAdd" aria-label="Add a book"><span class="st">+ Add a book</span></button>
    </div>
    <div class="plank"></div>
    <div class="legend mono"><span>Tap a spine to enter its world</span><span>NOW = reading</span><span>NEXT = up next</span><span>READ = finished</span></div>
    ${addOpen? addForm():""}
  </section>`;
}
function addForm(){
  return `<form class="addbox" data-form="addBook">
    <h3 style="font-family:var(--display);font-weight:400;font-size:32px;text-transform:uppercase">Add a book</h3>
    <div class="row">
      <label class="f"><span>Title</span><input type="text" id="nb-title" required></label>
      <label class="f"><span>Author</span><input type="text" id="nb-author" required></label>
      <label class="f"><span>Status</span><select id="nb-status"><option value="next">Up next</option><option value="reading">Reading now</option><option value="read">Finished</option></select></label>
    </div>
    ${sample? `<label style="display:flex;gap:10px;align-items:center"><input type="checkbox" id="nb-ai" checked style="width:20px;height:20px"> Have Claude build its world: discussion questions, activities and a reading plan</label>`:""}
    <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn solid" type="submit">Put it on the shelf</button><button class="btn" type="button" data-act="closeAdd">Cancel</button></div>
  </form>`;
}
function goalSort(a,b){ return (a.due||"9999")<(b.due||"9999")?-1:(a.due||"9999")>(b.due||"9999")?1:(a.at||0)-(b.at||0); }
function remindersSec(){
  const live=new Set(Object.keys(S.books));
  const open=Object.values(S.goals).filter(g=>!g.done && live.has(g.bookId)).sort(goalSort).slice(0,6);
  const items=open.map(g=>`<li><button class="check" role="checkbox" aria-checked="false" data-act="goal" data-id="${esc(g.id)}" aria-label="Mark done">${checkSVG}</button>
    <div><div style="font-weight:700">${esc(g.text)}</div><div class="bk">${esc(S.books[g.bookId].title)}</div></div>${dueChip(g.due)}</li>`).join("");
  return `<section class="sec">
    <div class="sec-head"><h2>On the mat <em>reminders &amp; next goals</em></h2></div>
    ${items? `<ul class="rem">${items}</ul>` : `<p class="muted">No open goals. Open a book and add one under Goals.</p>`}
  </section>`;
}

/* ---------- book world ---------- */
function bookView(b){
  const qs=b.questions||[], acts=b.activities||[], notes=by("notes",b.id), goals=by("goals",b.id);
  const counts={questions:qs.length,activities:acts.length,notes:notes.length,goals:goals.filter(g=>!g.done).length};
  const r=b.ratings||{}; const vals=MEMBERS.map(m=>r[m]).filter(x=>x>0);
  const avg=vals.length? (vals.reduce((a,c)=>a+c,0)/vals.length).toFixed(1) : "–";
  const meter=MEMBERS.map(m=>`<div class="row"><span>${m}</span><span class="dots">${[1,2,3,4,5].map(n=>`<button class="dot${(r[m]||0)>=n?" on":""}" data-act="rate" data-n="${n}" data-who="${m}" ${me===m?"":"disabled"} aria-label="${m} rates ${n} of 5"></button>`).join("")}</span></div>`).join("");
  return `<div style="${colors(b)}">
  <div class="wrap"><a class="back link mono" href="#">← Back to the shelf</a></div>
  <div class="hero">
    <div class="left">
      <span class="mono">Book Nº ${bookNo(b)} · ${esc(STATUS[b.status]||"")}</span>
      <h1 class="t">${esc(b.title)}</h1>
      <div class="by">by ${esc(b.author)}</div>
      ${b.blurb? `<p class="blurb">${esc(b.blurb)}</p>`:""}
      <div class="ctrls">
        <label class="mono" for="bk-status" style="opacity:.8">Status</label>
        <select id="bk-status" data-change="status"><option value="next"${b.status==="next"?" selected":""}>Up next</option><option value="reading"${b.status==="reading"?" selected":""}>Reading now</option><option value="read"${b.status==="read"?" selected":""}>Finished</option></select>
        <button class="btn small" data-act="copy" data-id="${esc(b.id)}">Copy for the chat</button>
        ${confirmDel? `<span class="confirm"><span>Remove from the shelf?</span><button class="btn small" data-act="delBook">Yes, remove</button><button class="btn small" data-act="noDel">Keep it</button></span>` : `<button class="link" data-act="askDel" style="color:inherit">Remove book</button>`}
      </div>
    </div>
    <div class="right">
      <div><span class="mono">Thot-o-meter</span><div class="avg">${avg}<span style="font-size:20px"> / 5</span></div></div>
      <div class="meter">${meter}</div>
      <span class="mono" style="opacity:.8">${me? "Tap the dots in your row to rate" : "Pick your name up top to rate"}</span>
    </div>
  </div>
  <div class="wrap">
    <div class="tabs" role="tablist">${TABS.map(([k,l])=>`<button class="tab" role="tab" aria-selected="${tab===k}" data-act="tab" data-tab="${k}">${l}<sup>${counts[k]}</sup></button>`).join("")}</div>
    <div class="panel" role="tabpanel">${tab==="questions"?qPanel(b,qs):tab==="activities"?aPanel(b,acts):tab==="notes"?nPanel(b,notes):gPanel(b,goals)}</div>
  </div></div>`;
}
function buildBtn(b){
  if(!sample) return "";
  return building===b.id? `<button class="btn" disabled>Claude is building this world…</button>` : `<button class="btn solid" data-act="build" data-id="${esc(b.id)}">Have Claude build this world</button>`;
}
function qPanel(b,qs){
  const ans=by("answers",b.id);
  const list=qs.map((q,i)=>{
    const mine=ans.find(a=>a.q===i && a.who===me);
    const others=ans.filter(a=>a.q===i).sort((x,y)=>MEMBERS.indexOf(x.who)-MEMBERS.indexOf(y.who));
    const tid=`ans-${b.id}-${i}`;
    if(!(tid in drafts) && mine) drafts[tid]=mine.text;
    return `<article class="q"><div class="qn">Q${i+1}</div><div>
      <p class="qt">${esc(q)}</p>
      ${others.length? `<div class="answers">${others.map(a=>`<div class="ans">${av(a.who)}<p><span class="who">${esc(a.who)}:</span> ${esc(a.text)}</p></div>`).join("")}</div>`:""}
      <form class="reply" data-form="answer" data-q="${i}"><label class="f" style="flex:1"><span>${me? `Your take, ${esc(me)}` : "Your take"}</span><textarea id="${esc(tid)}" rows="2" placeholder="Hot take, soft take, chaotic take…"></textarea></label><button class="btn small" type="submit">${mine?"Update":"Post"}</button></form>
    </div></article>`;
  }).join("");
  return `<p class="panel-intro">Answer before meetup night so the conversation starts warm. Everyone sees everyone's take.</p>
    ${list || `<div class="empty"><h3>No questions yet</h3><p>Write your own below${sample?", or let Claude draft a set for this book":""}.</p>${buildBtn(b)}</div>`}
    <form class="addq" data-form="addQ"><label class="f" style="flex:1"><span>Add a question</span><input type="text" id="addq-${esc(b.id)}" placeholder="What I really want to ask the group is…"></label><button class="btn small" type="submit">Add</button></form>`;
}
function aPanel(b,acts){
  const done=b.done||{};
  const cards=acts.map((a,i)=>{ const d=done[i]; return `<div class="act${d?" done":""}">
      ${d? `<span class="stamp">DONE · ${esc(String(d).toUpperCase())}</span>`:""}
      <h3>${esc(a.title)}</h3><p>${esc(a.desc)}</p>
      <button class="btn small" data-act="actDone" data-i="${i}">${d?"Undo":"We did this"}</button></div>`; }).join("");
  return `<p class="panel-intro">Things to do together, in person or in the group chat. Mark them off as you go.</p>
    ${cards? `<div class="acts">${cards}</div>` : `<div class="empty"><h3>No activities yet</h3><p>Add one below${sample?", or let Claude dream some up":""}.</p>${buildBtn(b)}</div>`}
    <form class="addline" data-form="addAct" style="grid-template-columns:minmax(0,1fr) minmax(0,1.6fr) auto">
      <label class="f"><span>Activity</span><input type="text" id="adda-t-${esc(b.id)}" placeholder="Name it"></label>
      <label class="f"><span>What we do</span><input type="text" id="adda-d-${esc(b.id)}" placeholder="One line on how it works"></label>
      <button class="btn small" type="submit">Add</button></form>`;
}
function nPanel(b,notes){
  notes=notes.sort((x,y)=>(y.at||0)-(x.at||0));
  const cards=notes.map(n=>`<div class="note ${n.kind==="quote"?"quote":n.kind==="hot"?"hot":""}" style="--mc:${memberVar(n.who)}">
    <div class="k"><span>${n.kind==="quote"?"Quote":n.kind==="hot"?"Hot take":"Note"}</span>${n.page?`<span>p. ${esc(n.page)}</span>`:""}</div>
    <p>${n.kind==="quote"?"“"+esc(n.text)+"”":esc(n.text)}</p>
    <div class="foot">${av(n.who)}<span>${esc(n.who)}</span><span class="muted">· ${new Date(n.at||0).toLocaleDateString("en-US",{month:"short",day:"numeric"})}</span>${n.who===me?`<button class="x" data-act="delNote" data-id="${esc(n.id)}">Delete</button>`:""}</div></div>`).join("");
  const nid=`note-${b.id}`;
  return `<form class="compose" data-form="note">
    <div class="row"><div class="seg" role="group" aria-label="Kind of note">${[["note","Note"],["quote","Quote"],["hot","Hot take"]].map(([k,l])=>`<button type="button" data-act="kind" data-k="${k}" aria-pressed="${noteKind===k}">${l}</button>`).join("")}</div>
    <label class="f pg"><span>Page</span><input type="number" id="pg-${esc(b.id)}" min="1" inputmode="numeric"></label></div>
    <textarea id="${esc(nid)}" rows="3" placeholder="${noteKind==="quote"?"Copy the line that got you…":noteKind==="hot"?"Say it with your chest…":"Margin thoughts, highlights, things to bring up…"}"></textarea>
    <div><button class="btn solid" type="submit">Pin it to the wall</button></div></form>
    ${cards? `<div class="wall">${cards}</div>` : `<div class="empty"><h3>The wall is blank</h3><p>Pin the first quote, highlight or hot take. Each of you gets your own color.</p></div>`}`;
}
function gPanel(b,goals){
  goals=goals.sort((x,y)=> (x.done?1:0)-(y.done?1:0) || goalSort(x,y));
  const n=daysUntil(b.meetDate);
  const cd=b.meetDate? (n<0?"Already happened":n===0?"Tonight":n===1?"Tomorrow":`In ${n} days`) : "No date yet";
  const rows=goals.map(g=>`<li class="${g.done?"done":""}"><button class="check" role="checkbox" aria-checked="${!!g.done}" data-act="goal" data-id="${esc(g.id)}" aria-label="${g.done?"Mark not done":"Mark done"}">${checkSVG}</button>
    <span class="gt">${esc(g.text)}</span><span class="by">${g.who?esc(g.who):""}</span><span style="display:flex;gap:10px;align-items:center">${g.done?"":dueChip(g.due)}<button class="link muted" data-act="delGoal" data-id="${esc(g.id)}" aria-label="Delete goal">×</button></span></li>`).join("");
  return `<div class="meet">
      <label class="f"><span>Next meetup</span><input type="date" id="meet-d-${esc(b.id)}" value="${esc(b.meetDate||"")}" data-change="meetDate"></label>
      <label class="f"><span>Where</span><input type="text" id="meet-p-${esc(b.id)}" value="${esc(b.meetPlace||"")}" placeholder="Whose couch? Which wine bar?" data-change="meetPlace"></label>
      <div class="cd">${esc(cd)}</div></div>
    ${rows? `<ul class="goals">${rows}</ul>` : `<div class="empty"><h3>No goals yet</h3><p>Split the book into chunks and give each one a date.</p>${buildBtn(b)}</div>`}
    <form class="addline" data-form="addGoal">
      <label class="f"><span>New goal or reminder</span><input type="text" id="addg-${esc(b.id)}" placeholder="Read Ch 4–7, bring snacks, pick the next book…"></label>
      <label class="f"><span>By</span><input type="date" id="addgd-${esc(b.id)}"></label>
      <button class="btn small" type="submit">Add</button></form>`;
}

/* ---------- actions ---------- */
function curBook(){ const r=location.hash.slice(1); return r.startsWith("book-")? S.books[r.slice(5)] : null; }
function chatText(b){
  const open=by("goals",b.id).filter(g=>!g.done).sort(goalSort)[0];
  const lines=[`UPWARD FACING THOTS 🧘‍♀️📚`, `${b.status==="read"?"We read":"Now reading"}: ${b.title} by ${b.author}`];
  if(open) lines.push(`Next goal: ${open.text}${open.due? " (by "+fmtDay(open.due)+")":""}`);
  if(b.meetDate) lines.push(`Meetup: ${fmtDay(b.meetDate)}${b.meetPlace? " · "+b.meetPlace:""}`);
  const qs=b.questions||[]; if(qs.length) lines.push(`Think about: ${qs[Math.floor(Math.random()*qs.length)]}`);
  lines.push("Namaste & annotate.");
  return lines.join("\n");
}
async function copy(text){
  try{ await navigator.clipboard.writeText(text); toast("Copied. Paste it in the group chat."); }
  catch(e){ toast("Copy didn't work here. Select the text and copy it."); }
}

document.addEventListener("click", e=>{
  const t=e.target.closest("[data-act]"); if(!t) return;
  const act=t.dataset.act, b=curBook();
  switch(act){
    case "me": me=t.dataset.who; lsSet("uft-me",me); renderMe(); render(); toast(`Hi ${me}.`); break;
    case "go": location.hash="book-"+t.dataset.id; break;
    case "openAdd": addOpen=true; if(location.hash) location.hash=""; render(); setTimeout(()=>{ const i=$("#nb-title"); if(i){ i.focus(); i.scrollIntoView({behavior:"smooth",block:"center"}); } },30); break;
    case "closeAdd": addOpen=false; render(); break;
    case "tab": tab=t.dataset.tab; lsSet("uft-tab",tab); render(); break;
    case "kind": noteKind=t.dataset.k; render(); break;
    case "copy": { const bk=S.books[t.dataset.id]; if(bk) copy(chatText(bk)); break; }
    case "askDel": confirmDel=true; render(); break;
    case "noDel": confirmDel=false; render(); break;
    case "delBook": if(b){ confirmDel=false; const id=b.id; location.hash=""; safe(store.del("books",id),"Removed from the shelf."); } break;
    case "rate": if(b && t.dataset.who===me){ const n=+t.dataset.n; const cur=(b.ratings||{})[me]; safe(store.update("books",b.id,{ratings:{[me]: cur===n?0:n}})); } break;
    case "actDone": if(b){ if(needMe()) return; const i=t.dataset.i; const d=(b.done||{})[i]; safe(store.update("books",b.id,{done:{[i]: d? null : me}})); } break;
    case "goal": { const g=S.goals[t.dataset.id]; if(g){ if(needMe()) return; safe(store.update("goals",g.id,{done:!g.done, doneBy: g.done? null : me})); } break; }
    case "delGoal": safe(store.del("goals",t.dataset.id)); break;
    case "delNote": safe(store.del("notes",t.dataset.id)); break;
    case "build": { const bk=S.books[t.dataset.id]; if(bk) buildWorld(bk); break; }
  }
});
document.addEventListener("input", e=>{ const el=e.target; if(el.id && (el.tagName==="TEXTAREA"||el.tagName==="INPUT") && !el.dataset.change) drafts[el.id]=el.value; });
document.addEventListener("change", e=>{
  const el=e.target, k=el.dataset.change, b=curBook(); if(!k||!b) return;
  if(k==="status") safe(store.update("books",b.id,{status:el.value}), `Marked ${STATUS[el.value].toLowerCase()}.`);
  if(k==="meetDate") safe(store.update("books",b.id,{meetDate:el.value||null}), el.value? "Meetup saved.":"Meetup cleared.");
  if(k==="meetPlace") safe(store.update("books",b.id,{meetPlace:el.value.trim()}), "Spot saved.");
});
function clearDraft(...ids){ ids.forEach(id=>{ delete drafts[id]; const el=document.getElementById(id); if(el) el.value=""; }); }

document.addEventListener("submit", async e=>{
  const f=e.target.closest("[data-form]"); if(!f) return; e.preventDefault();
  const kind=f.dataset.form, b=curBook();
  if(kind==="addBook"){
    const title=$("#nb-title").value.trim(), author=$("#nb-author").value.trim(), status=$("#nb-status").value;
    if(!title||!author){ toast("Add a title and an author."); return; }
    const ai=$("#nb-ai")?.checked;
    const id=slug(title), order=Math.max(0,...Object.values(S.books).map(x=>x.order||0))+1;
    const book={title,author,status,order,colors:PALETTES[order%PALETTES.length],questions:[],activities:[],ratings:{},done:{},addedBy:me||null,at:Date.now()};
    addOpen=false; clearDraft("nb-title","nb-author");
    try{ await store.set("books",id,book); }catch(err){ safe(Promise.reject(err)); return; }
    location.hash="book-"+id; toast(`${title} is on the shelf.`);
    if(ai && sample) buildWorld({...book,id});
    return;
  }
  if(!b) return;
  if(kind==="answer"){
    if(needMe()) return;
    const i=+f.dataset.q, tid=`ans-${b.id}-${i}`, text=(document.getElementById(tid).value||"").trim();
    const docId=`${b.id}--q${i}--${me}`;
    if(!text){ if(S.answers[docId]){ await safe(store.del("answers",docId),"Answer removed."); delete drafts[tid]; } return; }
    drafts[tid]=text;
    safe(store.set("answers",docId,{bookId:b.id,q:i,who:me,text,at:Date.now()}),"Posted.");
  }
  if(kind==="addQ"){
    const id=`addq-${b.id}`, q=document.getElementById(id).value.trim(); if(!q) return;
    clearDraft(id); safe(store.update("books",b.id,{questions:[...(b.questions||[]),q]}),"Question added.");
  }
  if(kind==="addAct"){
    const ti=`adda-t-${b.id}`, di=`adda-d-${b.id}`;
    const title=document.getElementById(ti).value.trim(), desc=document.getElementById(di).value.trim(); if(!title) return;
    clearDraft(ti,di); safe(store.update("books",b.id,{activities:[...(b.activities||[]),{title,desc}]}),"Activity added.");
  }
  if(kind==="note"){
    if(needMe()) return;
    const ni=`note-${b.id}`, pi=`pg-${b.id}`;
    const text=document.getElementById(ni).value.trim(), page=document.getElementById(pi).value.trim(); if(!text) return;
    clearDraft(ni,pi); safe(store.set("notes",uid(),{bookId:b.id,who:me,kind:noteKind,text,page:page||null,at:Date.now()}),"Pinned.");
  }
  if(kind==="addGoal"){
    const gi=`addg-${b.id}`, di=`addgd-${b.id}`;
    const text=document.getElementById(gi).value.trim(), due=document.getElementById(di).value; if(!text) return;
    clearDraft(gi,di); safe(store.set("goals",uid(),{bookId:b.id,text,due:due||null,done:false,who:me||null,at:Date.now()}),"Goal added.");
  }
});

async function buildWorld(b){
  if(!sample||building) return;
  building=b.id; render();
  const prompt=`You are designing a discussion kit for "Upward Facing Thots", a book club of three close friends (Jess, Mandy and Beatriz) named after their group chat. Tone: warm, playful, a little cheeky, but the questions should be genuinely thought-provoking.

Book: "${b.title}" by ${b.author}.

Return ONLY a JSON object with exactly these keys:
- "blurb": one sentence (under 22 words) on why this book is worth arguing about.
- "questions": an array of 8 discussion questions. Reference the book's real characters, ideas and scenes. Mix deep, personal and funny.
- "activities": an array of 5 objects {"title": short name, "desc": one sentence} — things the three can do together in person or in their group chat, tied to this book.
- "goals": an array of 4 short reading-plan milestones that split the book into chunks (use real chapter or part ranges if you know them; otherwise use quarters).

If you don't know this book well, keep questions about its themes and the readers' reactions rather than inventing plot details.`;
  try{
    const v=await sample.json(prompt,{modelTier:"default"});
    const qs=Array.isArray(v?.questions)? v.questions.filter(x=>typeof x==="string").slice(0,12):[];
    const acts=Array.isArray(v?.activities)? v.activities.filter(x=>x&&x.title).map(x=>({title:String(x.title),desc:String(x.desc||"")})).slice(0,8):[];
    const gs=Array.isArray(v?.goals)? v.goals.filter(x=>typeof x==="string").slice(0,6):[];
    const fresh=S.books[b.id]||b;
    await store.update("books",b.id,{blurb: fresh.blurb || (typeof v?.blurb==="string"? v.blurb:""), questions:[...(fresh.questions||[]),...qs], activities:[...(fresh.activities||[]),...acts]});
    for(let i=0;i<gs.length;i++) await store.set("goals",uid(),{bookId:b.id,text:gs[i],due:null,done:false,who:"Claude",at:Date.now()+i});
    toast("This world is built. Dive in.");
  }catch(e){
    toast(e&&e.code==="not_granted"? "Claude isn't allowed on this page for you." : e&&e.code==="rate_limited"? "Claude needs a breather. Try again in a minute." : "Claude couldn't build it this time. Try again.");
  }finally{ building=null; render(); }
}

window.addEventListener("hashchange", ()=>{ confirmDel=false; render(); window.scrollTo(0,0); });
boot();
})();
</script>
