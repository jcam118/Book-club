<title>Upward Facing Thots</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Instrument+Serif:ital@0;1&family=Mrs+Saint+Delafield&family=Six+Caps&display=swap">
<style>
/* Layout: collaged color bands (mustard hero, book-colored now-reading, periwinkle shelf, mint mat), bento tiles, face-out covers, stickers. Single bold look in both themes. */
:root{
  color-scheme:light;
  --ink:#151012; --paper:#FBF4EA; --white:#FFFDF8;
  --mustard:#F4C84A; --tomato:#F2542D; --pink:#F7A8CF; --lav:#B7B0F7; --mint:#9FDDB8; --butter:#FFE27A; --cobalt:#2F5BEA;
  --jess:#F2542D; --mandy:#2F5BEA; --bea:#D92D86;
  --late:#C8102E; --soon:#B4580A;
  --cond:"Six Caps","Bebas Neue","Arial Narrow",sans-serif;
  --serif:"Instrument Serif","Georgia",serif;
  --script:"Mrs Saint Delafield","Brush Script MT",cursive;
  --sans:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"DM Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--mustard)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
h1,h2,h3{margin:0;font-weight:400;text-wrap:balance}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.serif{font-family:var(--serif)}
i,.it{font-family:var(--serif);font-style:italic;font-weight:400}

/* ---------- shared pieces ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2.5px solid var(--ink);background:var(--white);color:var(--ink);padding:11px 20px;font-weight:700;cursor:pointer;text-decoration:none;border-radius:14px;line-height:1.1;transition:transform .15s, box-shadow .15s}
.btn.solid{background:var(--ink);color:var(--white)}
.btn.small{padding:7px 14px;font-size:14px;border-radius:11px}
.btn:hover{transform:translate(-2px,-2px);box-shadow:4px 4px 0 var(--ink)}
.btn:disabled{opacity:.55;cursor:default;transform:none;box-shadow:none}
.linkbtn{background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;font-weight:500}
input[type=text],input[type=date],input[type=number],select,textarea{width:100%;background:var(--white);color:var(--ink);border:2.5px solid var(--ink);padding:10px 12px;border-radius:12px;min-width:0}
textarea{resize:vertical;min-height:64px}
label.f{display:grid;gap:6px;min-width:0}
label.f>span{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.av{display:inline-grid;place-items:center;border-radius:50%;color:#fff;font-weight:700;font-size:12px;flex:none;width:26px;height:26px;border:2px solid var(--ink)}
.av.Jess{background:var(--jess)} .av.Mandy{background:var(--mandy)} .av.Beatriz{background:var(--bea)}
.pill{display:inline-flex;align-items:center;gap:6px;border:2.5px solid var(--ink);border-radius:999px;padding:7px 16px 7px 12px;font-weight:500;font-size:18px;text-decoration:none;cursor:pointer;color:var(--ink);white-space:nowrap;line-height:1}
.pill i{font-size:1.12em}
.pill .ar{font-family:var(--mono);font-size:14px}
.sticker{display:inline-block;border:2.5px solid var(--ink);padding:6px 14px;line-height:1;box-shadow:3px 3px 0 var(--ink)}
.due{font-family:var(--mono);font-size:12px;letter-spacing:.04em;padding:4px 9px;border:2px solid var(--ink);border-radius:999px;white-space:nowrap;background:var(--white);font-variant-numeric:tabular-nums}
.due.late{background:var(--tomato);color:var(--white)} .due.soon{background:var(--butter)}
.check{width:28px;height:28px;border:2.5px solid var(--ink);border-radius:9px;background:var(--white);cursor:pointer;display:grid;place-items:center;flex:none;padding:0;color:var(--ink)}
.check svg{width:15px;height:15px;opacity:0}
.check:hover svg{opacity:.3}
.check[aria-checked="true"]{background:var(--ink);color:var(--white)}
.check[aria-checked="true"] svg{opacity:1}
.empty{border:2.5px dashed var(--ink);border-radius:20px;padding:26px;display:grid;gap:10px;justify-items:start;background:var(--white)}
.empty h3{font-family:var(--cond);font-size:56px;line-height:.9;text-transform:uppercase}
.banner{background:var(--ink);color:var(--mustard)}
.banner .wrap{padding-block:9px;font-size:14px}

/* ---------- hero ---------- */
.hero{background:var(--mustard);border-bottom:3px solid var(--ink);position:relative;overflow:hidden}
.hero .wrap{padding-block:18px 26px;position:relative}
.hero-top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.hey{font-family:var(--serif);font-size:clamp(30px,4vw,46px);line-height:1;margin-top:18px}
.mega{position:relative;margin-top:4px;padding-bottom:.1em}
.mega .uf{display:block;font-family:var(--cond);text-transform:uppercase;font-size:min(27vw,340px);line-height:.8;letter-spacing:.005em;white-space:nowrap}
.mega .thots{position:absolute;right:1%;bottom:-.42em;font-family:var(--script);color:var(--tomato);font-size:min(22vw,250px);line-height:1;transform:rotate(-9deg);text-shadow:3px 3px 0 var(--ink);pointer-events:none}
.hero-row{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-top:34px}
.collage{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.collage .sticker:nth-child(1){background:var(--lav);font-family:var(--serif);font-style:italic;font-size:30px;transform:rotate(-6deg)}
.collage .sticker:nth-child(2){background:var(--white);font-family:var(--mono);font-size:15px;text-transform:uppercase;letter-spacing:.12em;transform:rotate(4deg)}
.collage .sticker:nth-child(3){background:var(--ink);color:var(--butter);font-family:var(--cond);font-size:44px;text-transform:uppercase;padding:2px 14px;transform:rotate(-3deg)}
.collage .sticker:nth-child(4){background:var(--pink);font-family:var(--script);font-size:40px;padding:0 16px;transform:rotate(7deg)}
.doodle{width:150px;height:auto;flex:none}
.me{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip-m{display:inline-flex;align-items:center;gap:8px;border:2.5px solid var(--ink);background:var(--white);border-radius:999px;padding:5px 14px 5px 5px;cursor:pointer;font-weight:700}
.chip-m[aria-pressed="true"]{background:var(--ink);color:var(--white)}
.me.ask .chip-m{animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{50%{transform:translateY(-4px)}}
.pills{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.pills .pill:nth-child(1){background:var(--tomato);color:var(--white)}
.pills .pill:nth-child(2){background:var(--lav)}
.pills .pill:nth-child(3){background:var(--mint)}
.pills .pill:nth-child(4){background:var(--pink)}

/* ---------- covers ---------- */
.cv{container-type:inline-size;display:block;min-width:0}
.cover{aspect-ratio:2/3;width:100%;max-width:100%;background:var(--pa);color:var(--fa);border:3px solid var(--ink);border-radius:5px 14px 14px 5px;box-shadow:inset 9px 0 0 rgba(0,0,0,.16),10px 12px 0 var(--ink);padding:9cqw 9cqw 8cqw 13cqw;display:flex;flex-direction:column;gap:3cqw;overflow:hidden;position:relative}
.cover .art{flex:1;min-height:0;display:grid;place-items:center}
.cover .art svg{width:100%;height:100%;max-height:100%}
.cover .ct{font-family:var(--cond);text-transform:uppercase;font-size:21cqw;line-height:.82;letter-spacing:.01em}
.cover .ct.long{font-size:13cqw}
.cover.serif .ct{font-family:var(--serif);font-style:italic;text-transform:none;font-size:15cqw;line-height:.9}
.cover .ca{font-family:var(--mono);font-size:5.5cqw;letter-spacing:.12em;text-transform:uppercase;opacity:.9}

/* ---------- now reading ---------- */
.now{background:var(--pa);color:var(--fa);border-bottom:3px solid var(--ink)}
.now .wrap{display:grid;grid-template-columns:minmax(0,240px) minmax(0,1.4fr) minmax(0,300px);gap:40px;align-items:center;padding-block:48px}
.now .cv{transform:rotate(-5deg)}
.now .lbl{display:inline-block;background:var(--ink);color:var(--white);padding:5px 10px;border-radius:8px}
.now .t{font-family:var(--cond);text-transform:uppercase;font-size:clamp(70px,9vw,140px);line-height:.82;margin-top:12px}
.now .by{font-family:var(--serif);font-style:italic;font-size:30px;margin-top:6px}
.now .goal{display:inline-block;margin-top:16px;background:var(--white);color:var(--ink);transform:rotate(-1.5deg);font-weight:700;font-size:16px;line-height:1.35;padding:9px 14px;max-width:100%}
.now .goal .mono{display:block;font-size:10px;margin-bottom:3px}
.now .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.stack{display:grid;gap:12px}
.tile{border:3px solid var(--ink);border-radius:22px;padding:16px 18px;color:var(--ink);min-width:0}
.tile .n{font-family:var(--cond);font-size:72px;line-height:.85;font-variant-numeric:tabular-nums}
.tile .s{font-size:14px;font-weight:500}
.stack .tile{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center}

/* ---------- shelf ---------- */
.band{border-bottom:3px solid var(--ink)}
.band .wrap{padding-block:46px 50px}
.shelf-band{background:var(--lav)}
.mat-band{background:var(--mint)}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:26px}
.head h2{display:inline-block;font-family:var(--cond);text-transform:uppercase;font-size:clamp(84px,12vw,150px);line-height:.8;position:relative}
.head h2 .sc{position:absolute;left:84%;bottom:-.05em;font-family:var(--script);text-transform:none;font-size:.52em;color:var(--white);white-space:nowrap;transform:rotate(-7deg);text-shadow:2px 2px 0 var(--ink)}
.shelf{display:flex;align-items:flex-end;gap:5px;overflow-x:auto;padding:30px 6px 0;min-height:340px}
.plank{height:18px;background:var(--ink);border-radius:4px}
.spine{flex:none;writing-mode:vertical-rl;transform:rotate(180deg);display:flex;justify-content:space-between;align-items:center;gap:14px;padding:16px 10px;border:3px solid var(--ink);border-radius:5px;cursor:pointer;background:var(--pa);color:var(--fa);transition:transform .2s;position:relative;overflow:hidden}
.spine:hover,.spine:focus-visible{transform:rotate(180deg) translateY(16px)}
.spine .st{line-height:1;max-height:100%}
.spine .sa{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;opacity:.9}
.spine.v-cond .st{font-family:var(--cond);text-transform:uppercase;font-size:40px;line-height:.9}
.spine.v-serif .st{font-family:var(--serif);font-style:italic;font-size:30px;line-height:.95}
.spine.v-serif::before,.spine.v-serif::after{content:"";position:absolute;left:0;right:0;height:12px;background:var(--pb)}
.spine.v-serif::before{top:12px} .spine.v-serif::after{bottom:12px}
.spine.v-caps .st{font-weight:700;text-transform:uppercase;letter-spacing:.32em;font-size:20px}
.spine .no{writing-mode:horizontal-tb;transform:rotate(180deg);font-family:var(--mono);font-size:11px;background:var(--pb);color:var(--fb);border:2px solid var(--ink);border-radius:50%;width:30px;height:30px;display:grid;place-items:center;flex:none}
.spine .tag{font-family:var(--mono);font-size:10px;letter-spacing:.14em;background:var(--white);color:var(--ink);padding:7px 3px;border:2px solid var(--ink);border-radius:5px}
.shelf .flat{flex:none;align-self:flex-end;width:200px;height:44px;border:3px dashed var(--ink);border-radius:5px;background:var(--white);font-family:var(--cond);font-size:30px;text-transform:uppercase;cursor:pointer;margin-left:10px}
.shelf .flat:hover{background:var(--butter)}
.plant{flex:none;width:96px;height:auto;margin-left:6px;align-self:flex-end}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.legend span{background:var(--white);border:2px solid var(--ink);border-radius:999px;padding:5px 12px}

.addbox{border:3px solid var(--ink);border-radius:24px;padding:24px;display:grid;gap:14px;background:var(--butter);margin-top:30px;box-shadow:8px 8px 0 var(--ink)}
.addbox h3{font-family:var(--cond);font-size:64px;line-height:.85;text-transform:uppercase}
.addbox .row{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,.8fr);gap:12px}

/* ---------- mat (reminders) ---------- */
.rem{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.rem li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 16px;background:var(--white);border:2.5px solid var(--ink);border-radius:16px}
.rem li:nth-child(even){transform:rotate(.4deg)} .rem li:nth-child(odd){transform:rotate(-.3deg)}
.rem .bk{font-family:var(--serif);font-style:italic;font-size:16px;color:#4b3f3a}

/* ---------- ticker footer ---------- */
footer{background:var(--ink);color:var(--white)}
.ticker{overflow:hidden;border-bottom:2px solid var(--mustard);padding-block:12px}
.track{display:flex;width:max-content;animation:tick 32s linear infinite}
.track span{font-family:var(--cond);font-size:56px;line-height:1;text-transform:uppercase;padding-right:28px;color:var(--mustard);white-space:nowrap}
.track span i{font-family:var(--script);text-transform:none;color:var(--pink);font-size:.8em;font-style:normal}
@keyframes tick{to{transform:translateX(-50%)}}
footer .meta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:16px 30px;color:#cfc4bd}

/* ---------- book world ---------- */
.bk-hero{background:var(--pa);color:var(--fa);border-bottom:3px solid var(--ink)}
.bk-hero .wrap{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:48px;align-items:center;padding-block:22px 54px}
.backrow{grid-column:1/-1}
.back{display:inline-flex;align-items:center;gap:6px;background:var(--white);color:var(--ink);border:2.5px solid var(--ink);border-radius:12px;padding:7px 14px;text-decoration:none;font-weight:700}
.bk-hero .cv{transform:rotate(-4deg)}
.bk-hero .t{font-family:var(--cond);text-transform:uppercase;font-size:clamp(84px,12vw,190px);line-height:.8}
.bk-hero .by{font-family:var(--serif);font-style:italic;font-size:32px;margin-top:8px}
.bk-hero .blurb{max-width:54ch;font-size:17px;margin:14px 0 0}
.bk-hero .tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.bk-hero .tags .pill{font-size:16px;background:var(--white)}
.bk-hero .tags .pill:nth-child(2){background:var(--pb);color:var(--fb)}
.ctrls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:20px}
.ctrls select{width:auto;font-weight:700}
.ctrls .linkbtn{color:inherit}
.confirm{display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--white);color:var(--ink);border:2.5px solid var(--ink);border-radius:14px;padding:6px 6px 6px 12px}

.bento{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;padding-block:34px 10px}
.bt{border:3px solid var(--ink);border-radius:24px;padding:18px;min-height:170px;display:flex;flex-direction:column;justify-content:space-between;gap:10px;text-align:left;cursor:pointer;color:var(--ink);transition:transform .15s, box-shadow .15s;min-width:0}
.bt:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--ink)}
.bt[aria-pressed="true"]{transform:translate(-3px,-3px);box-shadow:7px 7px 0 var(--ink)}
.bt[aria-pressed="true"] .lab::after{content:" ●";font-size:14px}
.bt .ic{width:42px;height:42px}
.bt-b{display:grid;gap:8px}
.bt .n{font-family:var(--cond);font-size:84px;line-height:.8}
.bt .lab{font-size:21px;font-weight:500;line-height:1}
.bt .lab i{font-size:1.18em}
.bt.t-q{background:var(--tomato)} .bt.t-a{background:var(--lav)} .bt.t-n{background:var(--butter)} .bt.t-g{background:var(--mint)}
.meter{grid-column:span 2;background:var(--ink);color:var(--white);border:3px solid var(--ink);border-radius:24px;padding:18px 20px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:center}
.meter .avg{font-family:var(--cond);font-size:120px;line-height:.8;color:var(--mustard)}
.meter .avg small{font-size:40px;color:var(--white)}
.mrow{display:grid;grid-template-columns:70px 1fr;gap:10px;align-items:center;font-weight:700;font-size:14px;padding-block:3px}
.dots{display:flex;gap:6px}
.dot{width:24px;height:24px;border-radius:50%;border:2.5px solid var(--mc);background:transparent;cursor:pointer;padding:0}
.dot.on{background:var(--mc)}
.dot:disabled{cursor:default}
.meet-tile{grid-column:span 2;background:var(--pink);border:3px solid var(--ink);border-radius:24px;padding:18px 20px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.meet-tile .n{font-family:var(--cond);font-size:96px;line-height:.8;text-transform:uppercase}
.meet-tile .s{font-family:var(--serif);font-style:italic;font-size:22px}
.meet-tile[aria-pressed="true"]{transform:translate(-3px,-3px);box-shadow:7px 7px 0 var(--ink)}

.panel{padding-block:30px 70px}
.ph{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.ph h2{display:inline-block;font-family:var(--cond);text-transform:uppercase;font-size:clamp(80px,10vw,128px);line-height:.8;position:relative}
.ph h2 .sc{position:absolute;left:78%;bottom:-.05em;font-family:var(--script);text-transform:none;font-size:.5em;color:var(--tc);white-space:nowrap;transform:rotate(-8deg);text-shadow:2px 2px 0 var(--ink)}
.ph p{font-family:var(--serif);font-style:italic;font-size:22px;margin:0 0 6px;max-width:44ch;line-height:1.2}

.q{display:grid;grid-template-columns:96px minmax(0,1fr);gap:18px;padding-block:22px;border-top:2.5px solid var(--ink)}
.q .qn{font-family:var(--cond);font-size:64px;line-height:.85;color:var(--tomato);-webkit-text-stroke:1px var(--ink)}
.q .qt{font-family:var(--serif);font-size:clamp(23px,2.4vw,29px);line-height:1.15;margin:0 0 14px;max-width:46ch}
.answers{display:grid;gap:8px;margin-bottom:14px}
.ans{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;background:var(--white);border:2px solid var(--ink);border-radius:16px 16px 16px 4px;padding:10px 12px;max-width:62ch}
.ans p{margin:0;white-space:pre-wrap}
.ans .who{font-weight:700}
.reply{display:flex;gap:8px;align-items:flex-end;max-width:70ch}
.reply textarea{min-height:48px}
.addq{display:flex;gap:10px;margin-top:22px;align-items:flex-end;max-width:70ch}

.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.act{border:3px solid var(--ink);border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:10px;min-width:0;position:relative;background:var(--ac)}
.act h3{font-family:var(--cond);font-size:52px;text-transform:uppercase;line-height:.85;padding-right:40px}
.act p{margin:0}
.act .btn{align-self:flex-start;margin-top:auto}
.act .ic{position:absolute;top:16px;right:16px;width:34px;height:34px}
.act.done{background:var(--white)}
.act.done h3{text-decoration:line-through;text-decoration-thickness:3px}
.stamp{font-family:var(--mono);font-size:11px;letter-spacing:.1em;border:2.5px solid var(--ink);background:var(--mint);padding:4px 8px;transform:rotate(-4deg);align-self:flex-start;border-radius:6px}
.addline{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr) auto;gap:10px;margin-top:22px;align-items:end}

.compose{border:3px solid var(--ink);border-radius:24px;background:var(--white);padding:18px;display:grid;gap:12px;margin-bottom:30px;max-width:780px}
.seg{display:inline-flex;border:2.5px solid var(--ink);border-radius:999px;overflow:hidden}
.seg button{background:none;border:0;padding:7px 15px;cursor:pointer;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--white)}
.compose .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.compose .row .pg{width:110px}
.wall{columns:3 250px;column-gap:20px}
.note{break-inside:avoid;margin-bottom:20px;background:var(--nc);border:2.5px solid var(--ink);border-radius:6px;padding:18px 16px 14px;display:grid;gap:10px;box-shadow:5px 6px 0 var(--ink);position:relative}

<script>
(() => {
"use strict";
const MEMBERS = ["Jess","Mandy","Beatriz"];
const NOTE_BG = {Jess:"#FFB59E", Mandy:"#C9C4FA", Beatriz:"#F7A8CF"};
const PALETTES = [
  ["#2F5BEA","#FFF6E8","#F7A8CF","#151012"],
  ["#9FDDB8","#151012","#F2542D","#FFF6E8"],
  ["#F7A8CF","#151012","#2F5BEA","#FFF6E8"],
  ["#B7B0F7","#151012","#FFD23F","#151012"],
  ["#F2542D","#FFF6E8","#FFD23F","#151012"],
];
const POSES = ["Downward Dog-Ear","Child's Pose, with a paperback","Warrior II (chapters, not sets)","Corpse Pose: fell asleep reading","Happy Baby: finished the book","Tree Pose: still rooted on page 1","Lotus Position, fully annotated","Cobra: reading the last page first","Seated Twist: plot twist","Bridge Pose: between books"];
const STATUS = {reading:"Reading now", next:"Up next", read:"Finished"};
const CLUB_URL = "https://claude.ai/artifact/WrbRQvxpsBa1oiimGnYtyt";
const COLS = ["books","notes","answers","goals","members"];
const WK_BG = ["var(--butter)","var(--lav)","var(--mint)","var(--pink)","#FFB59E","var(--butter)"];
const TABS = {
  questions:{cls:"t-q", lab:"Hot <i>Questions</i>", head:"Questions", sc:"talk it out", tc:"var(--tomato)", intro:"Answer before meetup night so the conversation starts warm. Everyone sees everyone's take."},
  activities:{cls:"t-a", lab:"Group <i>Activities</i>", head:"Activities", sc:"do the thing", tc:"var(--lav)", intro:"Things to do together, in person or in the group chat. Mark them off as you go."},
  notes:{cls:"t-n", lab:"Margin <i>Notes</i>", head:"Notes", sc:"the wall", tc:"var(--butter)", intro:"Quotes, highlights and hot takes. Each of you gets your own paper color."},
  goals:{cls:"t-g", lab:"Next <i>Goals</i>", head:"Goals", sc:"stay on the mat", tc:"var(--mint)", intro:"Split the book into chunks, give each a date, and set the meetup."},
  plan:{cls:"t-p", lab:"", head:"Check-ins", sc:"week by week", tc:"var(--pink)", intro:"One Monday at a time. Answer the questions before each check-in, and try the experiment together."},
};

const S = { books:{}, notes:{}, answers:{}, goals:{}, members:{} };
let db = null, sample = null, downloads = null, user = null, myId = null, mode = "loading", loaded = new Set();
let openWk = null;
let me = lsGet("uft-me") || "";
let tab = lsGet("uft-tab") || "questions"; if(!TABS[tab]) tab="questions";
let noteKind = "note";
let addOpen = false, confirmDel = false, building = null;
const drafts = {};

/* ---------- helpers ---------- */
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function $(s,r=document){ return r.querySelector(s); }
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"),2600); }
function todayISO(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function parseDay(s){ if(!s) return null; const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }
function fmtDay(s){ const d=parseDay(s); return d? d.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"}) : ""; }
function daysUntil(s){ const d=parseDay(s); if(!d) return null; const t=parseDay(todayISO()); return Math.round((d-t)/86400000); }
function dueChip(s){
  if(!s) return "";
  const n=daysUntil(s);
  const cls = n<0?"late":n<=3?"soon":"ok";
  const lbl = n<0?`${-n}d late`:n===0?"Today":n===1?"Tomorrow":fmtDay(s);
  return `<span class="due ${cls}">${esc(lbl)}</span>`;
}
function slug(s){ return (String(s).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,32) || "book") + "-" + Math.random().toString(36).slice(2,6); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function av(who){ return MEMBERS.includes(who)? `<span class="av ${who}" aria-hidden="true">${who[0]}</span>` : `<span class="av" style="background:#8a7d77" aria-hidden="true">✺</span>`; }
function memberVar(who){ return who==="Jess"?"var(--jess)":who==="Mandy"?"var(--mandy)":who==="Beatriz"?"var(--bea)":"#8a7d77"; }
function pal(b){ return Array.isArray(b.colors)&&b.colors.length===4? b.colors : PALETTES[0]; }
function colors(b){ const c=pal(b); return `--pa:${c[0]};--fa:${c[1]};--pb:${c[2]};--fb:${c[3]}`; }
const checkSVG = `<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 8.5l4 4 8-9" fill="none" stroke="currentColor" stroke-width="2.6"/></svg>`;

/* ---------- calendar ---------- */
function ymd(s){ return s.replace(/-/g,""); }
function addDays(s,n){ const d=parseDay(s); d.setDate(d.getDate()+n); return d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0"); }
function timeParts(t){ if(!t) return null; const [h,m]=t.split(":").map(Number); const e=h*60+m+90; return {start:String(h).padStart(2,"0")+String(m).padStart(2,"0")+"00", end:String(Math.floor(e/60)%24).padStart(2,"0")+String(e%60).padStart(2,"0")+"00"}; }
function gcal(ev){
  const t=timeParts(ev.time);
  const dates = t? `${ymd(ev.date)}T${t.start}/${ymd(ev.date)}T${t.end}` : `${ymd(ev.date)}/${addDays(ev.date,1)}`;
  return "https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(ev.title)+"&dates="+dates+"&details="+encodeURIComponent(ev.details+"\n\n"+CLUB_URL);
}
function icsEsc(s){ return String(s).replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\n/g,"\\n"); }
function ics(evs){
  const now=new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d+/,"");
  const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Upward Facing Thots//Book Club//EN","CALSCALE:GREGORIAN","METHOD:PUBLISH"];
  evs.forEach(ev=>{
    const t=timeParts(ev.time);
    L.push("BEGIN:VEVENT","UID:"+ev.uid+"@upward-facing-thots","DTSTAMP:"+now);
    if(t) L.push("DTSTART:"+ymd(ev.date)+"T"+t.start,"DTEND:"+ymd(ev.date)+"T"+t.end);
    else L.push("DTSTART;VALUE=DATE:"+ymd(ev.date),"DTEND;VALUE=DATE:"+addDays(ev.date,1));
    L.push("SUMMARY:"+icsEsc(ev.title),"DESCRIPTION:"+icsEsc(ev.details+"\n\n"+CLUB_URL),"URL:"+CLUB_URL,
      "BEGIN:VALARM","ACTION:DISPLAY","TRIGGER:-P1D","DESCRIPTION:"+icsEsc("Tomorrow: "+ev.title),"END:VALARM","END:VEVENT");
  });
  L.push("END:VCALENDAR");
  return L.join("\r\n");
}
function wkEvent(b,w,i){
  return {uid:`${b.id}-checkin-${i+1}`, date:w.date, time:b.meetTime||"", title:`Upward Facing Thots · Check-in ${i+1}: ${w.reading.split(" · ")[0]}`,
    details:`${b.title}${b.meetPlace? "\nWhere: "+b.meetPlace:""}\nRead: ${w.reading}\nTry it this week: ${w.tryIt||""}`};
}
function goalEvent(g){ const b=S.books[g.bookId]; return {uid:`goal-${g.id}`, date:g.due, time:"", title:`Thots reminder: ${g.text}`, details:b? b.title : "Upward Facing Thots"}; }
async function saveIcs(evs,name){
  if(!downloads){ toast("Calendar files can't be saved here. Use the Google Calendar link."); return; }
  try{ const r=await downloads.save({filename:name, data:ics(evs)}); if(r&&r.status==="saved") toast("Saved. Open the file to add it to your calendar."); }
  catch(e){ if(e&&e.code!=="dismissed"&&e&&e.code!=="declined") toast("That calendar file didn't save. Try the Google Calendar link."); }
}
function nextWeek(b){ const ws=b.weeks||[]; for(let i=0;i<ws.length;i++){ if(daysUntil(ws[i].date)>=0) return {w:ws[i],i}; } return null; }

function booksSorted(){ return Object.values(S.books).sort((a,b)=>(a.order||0)-(b.order||0)); }
function current(){ const r=booksSorted().filter(b=>b.status==="reading"); return r[r.length-1] || null; }
function by(col,bookId){ return Object.values(S[col]).filter(x=>x.bookId===bookId); }
function bookNo(b){ return booksSorted().findIndex(x=>x.id===b.id)+1; }

/* ---------- art: covers, icons, doodles ---------- */
const MOTIF_FOR = {"little-bee":"bee","many-lives":"eye","mars-venus":"planets"};
function motif(b){ return b.motif || MOTIF_FOR[b.id] || "shapes"; }
const ART = {
  bee:(c)=>`<svg viewBox="0 0 100 100" aria-hidden="true"><path d="M6 92 C20 60 34 98 40 70 C44 52 30 50 36 64" fill="none" stroke="${c[1]}" stroke-width="2.4" stroke-dasharray="3 5" stroke-linecap="round"/><ellipse cx="54" cy="36" rx="9" ry="15" transform="rotate(-28 54 36)" fill="${c[0]}" stroke="${c[1]}" stroke-width="2.6"/><ellipse cx="70" cy="36" rx="9" ry="15" transform="rotate(28 70 36)" fill="${c[0]}" stroke="${c[1]}" stroke-width="2.6"/><ellipse cx="62" cy="60" rx="18" ry="13" fill="${c[1]}"/><path d="M56 48 v24 M65 47 v26" stroke="${c[0]}" stroke-width="3.4"/><circle cx="83" cy="56" r="6.5" fill="${c[1]}"/><path d="M86 50 q4 -8 9 -8 M84 50 q1 -9 5 -12" fill="none" stroke="${c[1]}" stroke-width="2" stroke-linecap="round"/></svg>`,
  eye:(c)=>`<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="46" fill="none" stroke="${c[1]}" stroke-width="2" stroke-dasharray="1.5 6" stroke-linecap="round"/><circle cx="50" cy="50" r="36" fill="none" stroke="${c[2]}" stroke-width="1.5"/><path d="M6 50 Q50 10 94 50 Q50 90 6 50Z" fill="${c[1]}" stroke="${c[3]}" stroke-width="2"/><circle cx="50" cy="50" r="17" fill="${c[2]}"/><circle cx="50" cy="50" r="8" fill="${c[3]}"/><circle cx="45" cy="45" r="3" fill="${c[1]}"/><circle cx="14" cy="18" r="4" fill="${c[2]}"/><circle cx="88" cy="84" r="3" fill="${c[1]}"/><circle cx="84" cy="14" r="2.5" fill="${c[1]}"/></svg>`,
  planets:(c)=>`<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="70" cy="60" r="20" fill="${c[2]}" stroke="${c[1]}" stroke-width="3"/><path d="M70 80 V97 M61 89 H79" stroke="${c[1]}" stroke-width="5" stroke-linecap="round"/><circle cx="34" cy="48" r="22" fill="none" stroke="${c[1]}" stroke-width="6"/><path d="M50 32 L67 15 M55 15 H67 V27" fill="none" stroke="${c[1]}" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 88 l6 -3 M86 30 l6 -2 M18 12 l3 5" stroke="${c[1]}" stroke-width="2.5" stroke-linecap="round"/></svg>`,
  shapes:(c)=>`<svg viewBox="0 0 100 100" aria-hidden="true"><path d="M14 8 A42 42 0 0 1 14 92Z" fill="${c[2]}" stroke="${c[1]}" stroke-width="2.5"/><circle cx="72" cy="30" r="18" fill="${c[1]}"/><rect x="58" y="62" width="34" height="30" fill="none" stroke="${c[1]}" stroke-width="3"/></svg>`,
};
function cover(b){
  const c=pal(b), m=motif(b), long=b.title.length>18;
  return `<div class="cover${m==="eye"?" serif":""}" style="${colors(b)}"><div class="art">${ART[m](c)}</div><div class="ct${long&&m!=="eye"?" long":""}">${esc(b.title)}</div><div class="ca">${esc(b.author)}</div></div>`;
}
const ICONS = {
  questions:`<svg class="ic" viewBox="0 0 40 40" fill="none" stroke="#151012" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8 h28 v18 h-16 l-8 7 v-7 h-4z" fill="#FFFDF8"/><path d="M16 14 q4 -4 7 0 q1 3 -3 5 v2 M20 24 v.5"/></svg>`,
  activities:`<svg class="ic" viewBox="0 0 40 40" fill="none" stroke="#151012" stroke-width="2.6" stroke-linejoin="round" aria-hidden="true"><path d="M20 4 l4.5 10 l11 1 l-8.3 7.3 l2.5 10.7 l-9.7 -5.8 l-9.7 5.8 l2.5 -10.7 l-8.3 -7.3 l11 -1z" fill="#FFFDF8"/></svg>`,

const PLANT = `<svg class="plant" viewBox="0 0 96 130" fill="none" stroke="#151012" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M48 84 C46 60 40 40 26 26 M48 84 C50 58 58 38 72 22 M48 84 V40"/><ellipse cx="24" cy="24" rx="12" ry="7" transform="rotate(35 24 24)" fill="#9FDDB8"/><ellipse cx="74" cy="20" rx="12" ry="7" transform="rotate(-40 74 20)" fill="#9FDDB8"/><circle cx="48" cy="30" r="10" fill="#F2542D"/><circle cx="48" cy="30" r="3.5" fill="#FFE27A"/><ellipse cx="34" cy="56" rx="9" ry="5" transform="rotate(25 34 56)" fill="#9FDDB8"/><path d="M22 84 H74 L68 128 H28 Z" fill="#F7A8CF"/><path d="M26 98 H70" /></svg>`;

/* ---------- store adapter (shared db, or this-device fallback) ---------- */
const store = {
  async set(col,id,data){ if(db){ await db.collection(col).doc(id).set(data); } else { S[col][id]={...data,id}; persistLocal(); render(); } },
  async update(col,id,patch){ if(db){ await db.collection(col).doc(id).update(patch); } else { S[col][id]=deepMerge({...S[col][id]},patch); persistLocal(); render(); } },
  async del(col,id){ if(db){ await db.collection(col).doc(id).delete(); } else { delete S[col][id]; persistLocal(); render(); } }
};
function deepMerge(t,p){ for(const k in p){ const v=p[k]; if(v && typeof v==="object" && !Array.isArray(v)){ t[k]=deepMerge({...(t[k]||{})},v); } else t[k]=v; } return t; }
function persistLocal(){ lsSet("uft-local", JSON.stringify(S)); }
async function safe(p, ok){
  try{ await p; if(ok) toast(ok); }
  catch(e){
    const c=e&&e.code;
    toast(c==="invalid_argument"? "You can read this shelf but not edit it. Ask Jess to invite you as an Editor." : c==="quota_exceeded"? "The shelf is full. Delete a few old notes to make room." : "That didn't save. Check your connection and try again.");
  }
}

async function boot(){
  $("#today").textContent = new Date().toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"});
  const day = Math.floor(Date.now()/86400000);
  const bits = ["Namaste &amp; annotate","<i>read</i>","Gossip","<i>repeat</i>","Today's pose: "+POSES[day % POSES.length],"<i>no stretching required</i>"];
  const run = bits.map(b=>`<span>${b} ✺</span>`).join("");
  $("#track").innerHTML = run + run;
  renderMe(); render();
  let api = null;
  try{ api = window.claude && window.claude.use ? await window.claude.use("db") : null; }catch(e){ api=null; }
  if(api){
    db = api; mode="shared";
    const timer = setTimeout(()=>{ if(loaded.size<COLS.length) setBanner("Still reaching the shared shelf. What you see may be out of date."); },10000);
    for(const col of COLS){
      db.collection(col).onSnapshot(snap=>{
        const o={}; snap.docs.forEach(d=>{ o[d.id]={...d.data(),id:d.id}; });
        S[col]=o; loaded.add(col);
        if(!snap.metadata.fromCache && loaded.size===COLS.length){ clearTimeout(timer); setBanner(""); }
        if(col==="members") syncMe();
        render();
      }, err=>{ clearTimeout(timer); setBanner(err.code==="revoked"? "This shelf is no longer shared with you." : "The shared shelf stopped updating. Reload to reconnect."); });
    }
  } else {
    mode="local";
    try{ const raw=lsGet("uft-local"); if(raw){ const o=JSON.parse(raw); for(const k of Object.keys(S)) S[k]=o[k]||{}; } }catch(e){}
    if(!Object.keys(S.books).length) seedLocal();
    setBanner("Saving on this device only. Open the shared link to read with Mandy and Beatriz.");
    loaded = new Set(COLS);
    render();
  }
  $("#mode").textContent = mode==="shared" ? "Synced for all three of you" : "Local copy";
  try{ sample = window.claude && window.claude.use ? await window.claude.use("sample") : null; }catch(e){ sample=null; }
  try{ downloads = window.claude && window.claude.use ? await window.claude.use("downloads") : null; }catch(e){ downloads=null; }
  try{ user = window.claude && window.claude.use ? await window.claude.use("user") : null; myId = user? await user.id() : null; }catch(e){ myId=null; }
  syncMe(); render();
}
/* Names are linked to claude.ai accounts: the first time you pick your name, it's claimed for your login. */
function claimedBy(name){ const m=S.members[name]; return m && m.uid || null; }
function syncMe(){
  if(!myId) return;
  const mine = MEMBERS.find(n=>claimedBy(n)===myId);
  if(mine && mine!==me){ me=mine; lsSet("uft-me",me); renderMe(); }
}
async function pickMe(name){
  if(db && myId){
    const owner=claimedBy(name);
    if(owner && owner!==myId){ toast(`${name} is already linked to another account.`); return; }
    if(!owner){
      const prev=MEMBERS.find(n=>claimedBy(n)===myId);
      try{
        if(prev) await store.del("members",prev);
        await store.set("members",name,{uid:myId, at:Date.now()});
      }catch(e){ safe(Promise.reject(e)); return; }
    }
  }
  me=name; lsSet("uft-me",me); renderMe(); render(); toast(db&&myId? `Hi ${me}. This name is now linked to your login.` : `Hi ${me}.`);
}
function setBanner(t){ $("#banner").hidden=!t; $("#bannerText").textContent=t||""; }
function seedLocal(){
  (window.UFT_STARTER||[]).forEach(b=>{ S.books[b.id]={...b}; });
  (window.UFT_STARTER_GOALS||[]).forEach(g=>{ S.goals[g.id]={...g}; });
  persistLocal();
}

/* ---------- me picker ---------- */
function renderMe(){
  const el=$("#me");
  el.classList.toggle("ask", !me);
  const linked = myId && me && claimedBy(me)===myId;
  el.innerHTML = `<span class="mono">${me? (linked? "Signed in as" : "Reading as") : "Who's reading?"}</span>` + MEMBERS.map(m=>{
    const taken = myId && claimedBy(m) && claimedBy(m)!==myId;
    return `<button class="chip-m" data-act="me" data-who="${m}" aria-pressed="${me===m}"${taken&&me!==m?' title="Linked to another account"':""}>${av(m)}${m}</button>`;
  }).join("");
  $("#hey").innerHTML = `Hey, <i>${esc(me||"you")}</i>`;
}
function needMe(){ if(!me){ toast("Tap your name up top first."); $("#me").scrollIntoView({behavior:"smooth",block:"center"}); return true; } return false; }

/* ---------- render ---------- */
function render(){
  const a=document.activeElement, fid=a&&a.id, ss=a&&a.selectionStart, se=a&&a.selectionEnd;
  const route=location.hash.slice(1);
  const v=$("#view");
  if(route.startsWith("book-") && S.books[route.slice(5)]) v.innerHTML = bookView(S.books[route.slice(5)]);
  else if(route.startsWith("book-") && loaded.size<COLS.length) v.innerHTML = loadingView();
  else v.innerHTML = homeView();
  for(const id in drafts){ const el=document.getElementById(id); if(el && "value" in el) el.value=drafts[id]; }
  if(fid){ const el=document.getElementById(fid); if(el){ el.focus({preventScroll:true}); try{ if(ss!=null) el.setSelectionRange(ss,se); }catch(e){} } }
}
function loadingView(){ return `<div class="wrap" style="padding-block:60px"><p class="serif" style="font-size:28px;font-style:italic;margin:0">Opening the shelf…</p></div>`; }

function homeView(){
  const books=booksSorted(), cur=current();
  if(mode==="loading" || (mode==="shared" && loaded.size<COLS.length && !books.length)) return loadingView();
  return pillsRow(cur) + nowBand(cur) + shelfSec(books) + remindersSec();
}
function pillsRow(cur){
  return `<div class="wrap"><nav class="pills" aria-label="Jump to">
    ${cur? `<a class="pill" href="#book-${esc(cur.id)}"><span class="ar">↳</span> Enter <i>the book</i></a>`:`<button class="pill" data-act="jump" data-to="now"><span class="ar">↳</span> Now <i>Reading</i></button>`}
    <button class="pill" data-act="jump" data-to="shelf"><span class="ar">↳</span> The <i>Shelf</i></button>
    <button class="pill" data-act="jump" data-to="mat"><span class="ar">↳</span> On <i>the Mat</i></button>
    <button class="pill" data-act="openAdd"><span class="ar">↳</span> Add <i>a Book</i></button>
  </nav></div>`;
}

function nowBand(b){
  if(!b) return `<section id="now" class="band" style="background:var(--pink)"><div class="wrap"><div class="empty"><h3>Nothing on the mat</h3><p>No book is marked “Reading now.” Add the next one, or open a book and change its status.</p><button class="btn solid" data-act="openAdd">Add a book</button></div></div></section>`;
  const qs=b.questions||[], ans=by("answers",b.id), notes=by("notes",b.id), goals=by("goals",b.id);
  const open=goals.filter(g=>!g.done).sort(goalSort);
  const doneN=goals.filter(g=>g.done).length;
  const n=daysUntil(b.meetDate);
  const meet = b.meetDate ? (n<0? "Done" : n===0? "Tonight" : n+" days") : "TBD";
  const meetSub = b.meetDate ? `${fmtDay(b.meetDate)}${b.meetPlace? " · "+esc(b.meetPlace):""}` : "Meetup date not set yet";
  const answered = new Set(ans.map(a=>String(a.q))).size;
  const totalQ = qs.length + (b.weeks||[]).reduce((n,w)=>n+(w.questions||[]).length,0);
  const nw = nextWeek(b);
  const meetTile = nw
    ? `<div class="tile" style="background:var(--butter)"><span class="n">${(()=>{const d=daysUntil(nw.w.date); return d===0?"Today":d===1?"1 day":d+" days";})()}</span><span class="s">Check-in Nº${nw.i+1} · ${esc(fmtDay(nw.w.date))}<br>Read ${esc(nw.w.reading.split(" · ")[0])}</span></div>`
    : `<div class="tile" style="background:var(--butter)"><span class="n">${esc(meet)}</span><span class="s">Meetup<br>${meetSub}</span></div>`;
  return `<section id="now" class="now" style="${colors(b)}"><div class="wrap">
    <a class="cv" href="#book-${esc(b.id)}" aria-label="Open ${esc(b.title)}">${cover(b)}</a>
    <div>
      <span class="lbl mono">Now reading · Book Nº ${bookNo(b)}</span>
      <h2 class="t">${esc(b.title)}</h2>
      <div class="by">by ${esc(b.author)}</div>
      ${open[0]? `<div class="goal sticker"><span class="mono">Next goal${open[0].due? " · "+esc(fmtDay(open[0].due)):""}</span>${esc(open[0].text)}</div>`:""}
      <div class="actions">
        <a class="btn solid" href="#book-${esc(b.id)}">Enter this world →</a>
        <button class="btn" data-act="copy" data-id="${esc(b.id)}">Copy update for the chat</button>
      </div>
    </div>
    <div class="stack">
      ${meetTile}
      <div class="tile" style="background:var(--lav)"><span class="n">${doneN}/${goals.length}</span><span class="s">Reading goals done</span></div>
      <div class="tile" style="background:var(--mint)"><span class="n">${answered}/${totalQ}</span><span class="s">Questions answered<br>${notes.length} note${notes.length===1?"":"s"} on the wall</span></div>
    </div>
  </div></section>`;
}

const VARIANTS = ["caps","serif","cond"];
function shelfSec(books){
  const read=books.filter(b=>b.status==="read").length;
  const spines=books.map((b,i)=>{
    const v = b.spine || VARIANTS[i % 3];
    const L = b.title.length;
    const h = 260 + ((L*7 + i*29) % 64);
    const w = v==="cond" ? (L>24? 104 : 70) : v==="serif" ? (L>18? 96 : 74) : (L>14? 92 : 66);
    const fs = v==="cond" ? (L>24? 34 : 46) : v==="serif" ? (L>18? 24 : 32) : (L>14? 15 : 20);
    return `<button class="spine v-${v}" style="${colors(b)};height:${h}px;width:${w}px" data-act="go" data-id="${esc(b.id)}" aria-label="${esc(b.title)} by ${esc(b.author)}, ${STATUS[b.status]||""}">
      <span class="sa">${esc(b.author)}</span><span class="st" style="font-size:${fs}px">${esc(b.title)}</span>${v==="caps"?`<span class="no">0${i+1}</span>`:`<span class="tag">${b.status==="reading"?"NOW":b.status==="next"?"NEXT":"READ"}</span>`}</button>`;
  }).join("");
  return `<section id="shelf" class="band shelf-band"><div class="wrap">
    <div class="head"><h2>The Shelf<span class="sc">getting full</span></h2><span class="mono">${books.length} book${books.length===1?"":"s"} · ${read} finished</span></div>
    <div class="shelf">${spines}
      <button class="flat" data-act="openAdd">+ Add a book</button>${PLANT}
    </div>
    <div class="plank"></div>
    <div class="legend mono"><span>Tap a spine to enter its world</span><span>Now = reading</span><span>Next = up next</span><span>Read = finished</span></div>
    ${addOpen? addForm():""}
  </div></section>`;
}
function addForm(){
  return `<form class="addbox" data-form="addBook">
    <h3>Add a book</h3>
    <div class="row">
      <label class="f"><span>Title</span><input type="text" id="nb-title" required></label>
      <label class="f"><span>Author</span><input type="text" id="nb-author" required></label>
      <label class="f"><span>Status</span><select id="nb-status"><option value="next">Up next</option><option value="reading">Reading now</option><option value="read">Finished</option></select></label>
    </div>
    ${sample? `<label style="display:flex;gap:10px;align-items:center;font-weight:500"><input type="checkbox" id="nb-ai" checked style="width:20px;height:20px"> Have Claude build its world: discussion questions, activities and a reading plan</label>`:""}
    <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn solid" type="submit">Put it on the shelf</button><button class="btn" type="button" data-act="closeAdd">Cancel</button></div>
  </form>`;
}
function goalSort(a,b){ return (a.due||"9999")<(b.due||"9999")?-1:(a.due||"9999")>(b.due||"9999")?1:(a.at||0)-(b.at||0); }
function remindersSec(){
  const live=new Set(Object.keys(S.books));
  const open=Object.values(S.goals).filter(g=>!g.done && live.has(g.bookId)).sort(goalSort).slice(0,6);
  const items=open.map(g=>`<li><button class="check" role="checkbox" aria-checked="false" data-act="goal" data-id="${esc(g.id)}" aria-label="Mark done">${checkSVG}</button>
    <div><div style="font-weight:700">${esc(g.text)}</div><div class="bk">${esc(S.books[g.bookId].title)}</div></div>${dueChip(g.due)}</li>`).join("");
  return `<section id="mat" class="band mat-band"><div class="wrap">
    <div class="head"><h2>On the Mat<span class="sc">next up</span></h2><span class="mono">Reminders &amp; goals across every book</span></div>
    ${items? `<ul class="rem">${items}</ul>` : `<div class="empty"><h3>All caught up</h3><p>No open goals. Open a book and add one under Goals.</p></div>`}
  </div></section>`;
}

/* ---------- book world ---------- */
function bookView(b){
  const qs=b.questions||[], acts=b.activities||[], notes=by("notes",b.id), goals=by("goals",b.id);
  const counts={questions:qs.length,activities:acts.length,notes:notes.length,goals:goals.filter(g=>!g.done).length};
  const r=b.ratings||{}; const vals=MEMBERS.map(m=>r[m]).filter(x=>x>0);
  const avg=vals.length? (vals.reduce((a,c)=>a+c,0)/vals.length).toFixed(1) : "?";
  const n=daysUntil(b.meetDate);
  const cd=b.meetDate? (n<0?"Done":n===0?"Tonight":n===1?"Tomorrow":`${n} days`) : "TBD";
  const meter=MEMBERS.map(m=>`<div class="mrow"><span>${m}</span><span class="dots" style="--mc:${memberVar(m)}">${[1,2,3,4,5].map(k=>`<button class="dot${(r[m]||0)>=k?" on":""}" data-act="rate" data-n="${k}" data-who="${m}" ${me===m?"":"disabled"} aria-label="${m} rates ${k} of 5"></button>`).join("")}</span></div>`).join("");
  if(tab==="plan" && !(b.weeks&&b.weeks.length)) tab="questions";

    ? `<button class="meet-tile" data-act="tab" data-tab="plan" aria-pressed="${tab==="plan"}" style="text-align:left;cursor:pointer"><div><span class="mono">${nw? "Next check-in · Nº"+(nw.i+1) : "Check-ins"}</span><div class="n">${nw? (()=>{const d=daysUntil(nw.w.date); return d===0?"Today":d===1?"Tomorrow":d+" days";})() : "Done"}</div></div><div class="s">${nw? esc(fmtDay(nw.w.date))+" · "+esc(nw.w.reading.split(" · ")[0]) : "All six check-ins complete"}<br><b style="font-family:var(--sans);font-style:normal;font-size:15px">Open the weekly plan →</b></div></button>`
    : `<button class="meet-tile" data-act="tab" data-tab="goals" style="text-align:left;cursor:pointer"><div><span class="mono">Next meetup</span><div class="n">${esc(cd)}</div></div><div class="s">${b.meetDate? esc(fmtDay(b.meetDate))+(b.meetPlace? " · "+esc(b.meetPlace):"") : "Set it under Goals →"}</div></button>`;
  return `<section class="bk-hero" style="${colors(b)}"><div class="wrap">
    <div class="backrow"><a class="back" href="#">← The Shelf</a></div>
    <div class="cv">${cover(b)}</div>
    <div>
      <span class="mono">Book Nº ${bookNo(b)} · ${esc(STATUS[b.status]||"")}</span>
      <h1 class="t">${esc(b.title)}</h1>

        <button class="btn small" data-act="copy" data-id="${esc(b.id)}">Copy for the chat</button>
        ${confirmDel? `<span class="confirm"><span>Remove from the shelf?</span><button class="btn small solid" data-act="delBook">Yes, remove</button><button class="btn small" data-act="noDel">Keep it</button></span>` : `<button class="linkbtn" data-act="askDel">Remove book</button>`}
      </div>
    </div>
  </div></section>
  <div class="wrap">
    <div class="bento">
      ${Object.keys(TABS).filter(k=>k!=="plan").map(k=>`<button class="bt ${TABS[k].cls}" aria-pressed="${tab===k}" data-act="tab" data-tab="${k}">${ICONS[k]}<span class="bt-b"><span class="n">${counts[k]}</span><span class="lab">${TABS[k].lab}</span></span></button>`).join("")}
      <div class="meter"><div><span class="mono">Thot-o-meter</span><div class="avg">${avg}<small>/5</small></div></div><div>${meter}<div class="mono" style="margin-top:8px;color:#cfc4bd">${me? "Tap the dots in your row to rate" : "Pick your name up top to rate"}</div></div></div>
      ${meetTile}
    </div>
    <div class="panel" id="panel">
      <div class="ph" style="--tc:${T.tc}"><h2>${T.head}<span class="sc">${T.sc}</span></h2></div>
      <div class="ph" style="margin-top:-6px"><p>${T.intro}</p></div>
      ${tab==="plan"?pPanel(b):tab==="questions"?qPanel(b,qs):tab==="activities"?aPanel(b,acts):tab==="notes"?nPanel(b,notes):gPanel(b,goals)}
    </div>
  </div>`;
}
function buildBtn(b){
  if(!sample) return "";
  return building===b.id? `<button class="btn" disabled>Claude is building this world…</button>` : `<button class="btn solid" data-act="build" data-id="${esc(b.id)}">Have Claude build this world</button>`;
}
function qItem(b,key,label,q){
  const ans=by("answers",b.id);
  const mine=ans.find(a=>String(a.q)===String(key) && a.who===me);
  const others=ans.filter(a=>String(a.q)===String(key)).sort((x,y)=>MEMBERS.indexOf(x.who)-MEMBERS.indexOf(y.who));
  const tid=`ans-${b.id}-${key}`;
  if(!(tid in drafts) && mine) drafts[tid]=mine.text;
  return `<article class="q"><div class="qn">${label}</div><div>
    <p class="qt">${esc(q)}</p>
    ${others.length? `<div class="answers">${others.map(a=>`<div class="ans">${av(a.who)}<p><span class="who">${esc(a.who)}:</span> ${esc(a.text)}</p></div>`).join("")}</div>`:""}
    <form class="reply" data-form="answer" data-q="${esc(key)}"><label class="f" style="flex:1"><span>${me? `Your take, ${esc(me)}` : "Your take"}</span><textarea id="${esc(tid)}" rows="2" placeholder="Hot take, soft take, chaotic take…"></textarea></label><button class="btn small solid" type="submit">${mine?"Update":"Post"}</button></form>
  </div></article>`;
}
function qPanel(b,qs){
  const list=qs.map((q,i)=>qItem(b,i,"Q."+String(i+1).padStart(2,"0"),q)).join("");
  const hasPlan=b.weeks&&b.weeks.length;
  return `${hasPlan? `<div class="empty" style="margin-bottom:20px;background:var(--pink)"><p style="margin:0;font-size:17px"><b>The check-in questions from ${esc(b.guideBy||"the guide")}'s guide live under <button class="linkbtn" data-act="tab" data-tab="plan">Check-ins</button>.</b> These are bonus thots for whenever the mood strikes.</p></div>`:""}
    ${list || `<div class="empty"><h3>No questions yet</h3><p>Write your own below${sample?", or let Claude draft a set for this book":""}.</p>${buildBtn(b)}</div>`}
    <form class="addq" data-form="addQ"><label class="f" style="flex:1"><span>Add a question</span><input type="text" id="addq-${esc(b.id)}" placeholder="What I really want to ask the group is…"></label><button class="btn small" type="submit">Add</button></form>`;
}
function pPanel(b){
  const ws=b.weeks||[], nw=nextWeek(b);
  if(openWk===null) openWk = nw? nw.i : -1;
  const cards=ws.map((w,i)=>{
    const d=daysUntil(w.date), isNext=nw&&nw.i===i, past=d<0, open=openWk===i;
    const chip = past? "Done" : d===0? "Today" : d===1? "Tomorrow" : `In ${d} days`;
    const tried=(b.tried||{})[i]||{};
    const ev=wkEvent(b,w,i);
    return `<div class="wk${isNext?" next":""}${past?" past":""}" style="--wc:${WK_BG[i%WK_BG.length]}">
      <button class="wk-h" data-act="wk" data-i="${i}" aria-expanded="${open}">
        <span class="no">0${i+1}</span>
        <span><span class="dt">${esc(fmtDay(w.date))}${b.meetTime? " · "+esc(fmtTime(b.meetTime)):""}${w.part? " · "+esc(w.part):""}</span><div class="tt">${esc(w.title)}</div><div class="rd">${esc(w.reading)}</div></span>
        <span class="chip${isNext?" hot":""}">${isNext? "Up next · ":""}${chip} ${open?"−":"+"}</span>
      </button>
      ${open? `<div class="wk-b">
        <div class="side">
          ${(w.ideas||[]).length? `<div><h4>Key ideas to watch for</h4><ul>${w.ideas.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`:""}
          ${w.angle? `<div class="blk angle"><h4>Dating &amp; anxiety angle</h4><p>${esc(w.angle)}</p></div>`:""}
          ${w.tryIt? `<div class="blk try"><h4>Try it this week</h4><p>${esc(w.tryIt)}</p><div class="tried">${MEMBERS.map(m=>`<button data-act="tried" data-i="${i}" aria-pressed="${!!tried[m]}" ${me&&me!==m?"disabled":""}>${av(m)}${tried[m]? m+" did it" : m}</button>`).join("")}</div></div>`:""}
        </div>
        <div class="wk-q"><h4>Discussion questions · pick the ones that spark</h4>${(w.questions||[]).map((q,j)=>qItem(b,`w${i}-${j}`,`${i+1}.${j+1}`,q)).join("")}</div>
      </div>
      <div class="wk-f">
        <a class="btn small calbtn" href="${esc(gcal(ev))}" target="_blank" rel="noopener">+ Google Calendar</a>
        ${downloads? `<button class="btn small calbtn" data-act="icsOne" data-i="${i}">+ Apple / Outlook</button>`:""}
        <label class="f dd" style="margin-left:auto"><span>Move this check-in</span><input type="date" id="wkd-${esc(b.id)}-${i}" value="${esc(w.date)}" data-change="wkDate" data-i="${i}"></label>
      </div>`:""}
    </div>`;
  }).join("");
  const fur=(b.further||[]).map((f,i)=>{ const has=Object.values(S.books).some(x=>x.title.toLowerCase()===f.title.toLowerCase());
    return `<div class="fb"><b>${esc(f.title)}</b><span class="mono">${esc(f.author)}</span><span>${esc(f.why)}</span>${has? `<span class="mono">On the shelf ✓</span>` : `<button class="btn small" data-act="addFurther" data-i="${i}">+ Add as up next</button>`}</div>`; }).join("");
  return `<div class="plan-top">
      <div class="credit">Built from <i>${esc(b.guideBy||"the club")}'s</i> book club guide.<br><span style="font-size:16px;font-family:var(--sans)">${ws.length} Monday check-ins. Answer before each one, then try the experiment together.</span></div>
      <div class="acts2">
        <label class="f tm"><span>Check-in time</span><input type="time" id="meet-t-${esc(b.id)}" value="${esc(b.meetTime||"")}" data-change="meetTime"></label>
        ${downloads? `<button class="btn solid" data-act="icsAll">Add all ${ws.length} to my calendar</button>`:""}
      </div>
    </div>
    ${cards}
    ${fur? `<div class="ph" style="margin-top:40px;--tc:var(--tomato)"><h2 style="font-size:clamp(60px,8vw,96px)">Go Further<span class="sc">from the guide</span></h2></div><p class="serif" style="font-style:italic;font-size:20px;margin:0">Ideas the book raises but doesn't resolve. Great picks for what's next on the shelf.</p><div class="further">${fur}</div>`:""}`;
}
function fmtTime(t){ const [h,m]=t.split(":").map(Number); return new Date(2000,0,1,h,m).toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"}); }
const ACT_BG = ["var(--lav)","var(--butter)","var(--pink)","var(--mint)","#FFB59E"];
function aPanel(b,acts){
  const done=b.done||{};
  const cards=acts.map((a,i)=>{ const d=done[i]; return `<div class="act${d?" done":""}" style="--ac:${ACT_BG[i%ACT_BG.length]}">
      ${ICONS.activities.replace('class="ic"','class="ic"')}
      <h3>${esc(a.title)}</h3>
      ${d? `<span class="stamp">DONE · ${esc(String(d).toUpperCase())}</span>`:""}
      <p>${esc(a.desc)}</p>
      <button class="btn small${d?"":" solid"}" data-act="actDone" data-i="${i}">${d?"Undo":"We did this"}</button></div>`; }).join("");
  return `${cards? `<div class="acts">${cards}</div>` : `<div class="empty"><h3>No activities yet</h3><p>Add one below${sample?", or let Claude dream some up":""}.</p>${buildBtn(b)}</div>`}
    <form class="addline" data-form="addAct">
      <label class="f"><span>Activity</span><input type="text" id="adda-t-${esc(b.id)}" placeholder="Name it"></label>
      <label class="f"><span>What we do</span><input type="text" id="adda-d-${esc(b.id)}" placeholder="One line on how it works"></label>
      <button class="btn small" type="submit">Add</button></form>`;
}
function nPanel(b,notes){
  notes=notes.sort((x,y)=>(y.at||0)-(x.at||0));
  const cards=notes.map(n=>`<div class="note ${n.kind==="quote"?"quote":n.kind==="hot"?"hot":""}" style="--nc:${NOTE_BG[n.who]||"#FFFDF8"}">
    <div class="k"><span>${n.kind==="quote"?"Quote":n.kind==="hot"?"Hot take":"Note"}</span>${n.page?`<span>p. ${esc(n.page)}</span>`:""}</div>
    <p>${n.kind==="quote"?"“"+esc(n.text)+"”":esc(n.text)}</p>
    <div class="foot">${av(n.who)}<span>${esc(n.who)}</span><span>· ${new Date(n.at||0).toLocaleDateString("en-US",{month:"short",day:"numeric"})}</span>${n.who===me?`<button class="x" data-act="delNote" data-id="${esc(n.id)}">Delete</button>`:""}</div></div>`).join("");
  const nid=`note-${b.id}`;
  return `<form class="compose" data-form="note">
    <div class="row"><div class="seg" role="group" aria-label="Kind of note">${[["note","Note"],["quote","Quote"],["hot","Hot take"]].map(([k,l])=>`<button type="button" data-act="kind" data-k="${k}" aria-pressed="${noteKind===k}">${l}</button>`).join("")}</div>
    <label class="f pg"><span>Page</span><input type="number" id="pg-${esc(b.id)}" min="1" inputmode="numeric"></label></div>
    <textarea id="${esc(nid)}" rows="3" placeholder="${noteKind==="quote"?"Copy the line that got you…":noteKind==="hot"?"Say it with your chest…":"Margin thoughts, highlights, things to bring up…"}"></textarea>
    <div><button class="btn solid" type="submit">Pin it to the wall</button></div></form>
    ${cards? `<div class="wall">${cards}</div>` : `<div class="empty"><h3>The wall is blank</h3><p>Pin the first quote, highlight or hot take.</p></div>`}`;
}
function gPanel(b,goals){
  goals=goals.sort((x,y)=> (x.done?1:0)-(y.done?1:0) || goalSort(x,y));
  const rows=goals.map(g=>`<li class="${g.done?"done":""}"><button class="check" role="checkbox" aria-checked="${!!g.done}" data-act="goal" data-id="${esc(g.id)}" aria-label="${g.done?"Mark not done":"Mark done"}">${checkSVG}</button>
    <span class="gt">${esc(g.text)}</span><span class="by">${g.done&&g.doneBy? "done by "+esc(g.doneBy) : g.who? "from "+esc(g.who):""}</span><span style="display:flex;gap:10px;align-items:center">${g.done?"":dueChip(g.due)}${!g.done&&g.due? `<a class="linkbtn" href="${esc(gcal(goalEvent(g)))}" target="_blank" rel="noopener" title="Add to Google Calendar">+ Cal</a>${downloads?`<button class="linkbtn" data-act="icsGoal" data-id="${esc(g.id)}" title="Apple or Outlook calendar file">.ics</button>`:""}`:""}<button class="linkbtn" data-act="delGoal" data-id="${esc(g.id)}" aria-label="Delete goal">×</button></span></li>`).join("");
  return `<div class="meet">
      <label class="f"><span>Next meetup</span><input type="date" id="meet-d-${esc(b.id)}" value="${esc(b.meetDate||"")}" data-change="meetDate"></label>
      <label class="f"><span>Where</span><input type="text" id="meet-p-${esc(b.id)}" value="${esc(b.meetPlace||"")}" placeholder="Whose couch? Which wine bar?" data-change="meetPlace"></label></div>
    ${rows? `<ul class="goals">${rows}</ul>` : `<div class="empty"><h3>No goals yet</h3><p>Split the book into chunks and give each one a date.</p>${buildBtn(b)}</div>`}
    <form class="addline" data-form="addGoal" style="grid-template-columns:minmax(0,1fr) 170px auto;max-width:900px">
      <label class="f"><span>New goal or reminder</span><input type="text" id="addg-${esc(b.id)}" placeholder="Read Ch 4–7, bring snacks, pick the next book…"></label>
      <label class="f"><span>By</span><input type="date" id="addgd-${esc(b.id)}"></label>
      <button class="btn small" type="submit">Add</button></form>`;
}

/* ---------- actions ---------- */
function curBook(){ const r=location.hash.slice(1); return r.startsWith("book-")? S.books[r.slice(5)] : null; }
function chatText(b){
  const open=by("goals",b.id).filter(g=>!g.done).sort(goalSort)[0];
  const lines=[`UPWARD FACING THOTS 🧘‍♀️📚`, `${b.status==="read"?"We read":"Now reading"}: ${b.title} by ${b.author}`];
  if(open) lines.push(`Next goal: ${open.text}${open.due? " (by "+fmtDay(open.due)+")":""}`);
  if(b.meetDate) lines.push(`Meetup: ${fmtDay(b.meetDate)}${b.meetPlace? " · "+b.meetPlace:""}`);
  const qs=b.questions||[]; if(qs.length) lines.push(`Think about: ${qs[Math.floor(Math.random()*qs.length)]}`);
  lines.push("Namaste & annotate.");
  return lines.join("\n");
}
async function copy(text){
  try{ await navigator.clipboard.writeText(text); toast("Copied. Paste it in the group chat."); }
  catch(e){ toast("Copy didn't work here. Select the text and copy it."); }
}

document.addEventListener("click", e=>{
  const t=e.target.closest("[data-act]"); if(!t) return;
  const act=t.dataset.act, b=curBook();
  switch(act){
    case "me": if(t.dataset.who!==me || !(myId && claimedBy(me)===myId)) pickMe(t.dataset.who); break;
    case "wk": openWk = openWk===+t.dataset.i ? -1 : +t.dataset.i; render(); break;
    case "tried": if(b){ if(needMe()) return; const i=t.dataset.i; const cur=((b.tried||{})[i]||{})[me]; safe(store.update("books",b.id,{tried:{[i]:{[me]: !cur}}})); } break;
    case "icsAll": if(b) saveIcs((b.weeks||[]).map((w,i)=>wkEvent(b,w,i)), "upward-facing-thots-checkins.ics"); break;
    case "icsOne": if(b){ const i=+t.dataset.i; saveIcs([wkEvent(b,b.weeks[i],i)], `thots-checkin-${i+1}.ics`); } break;
    case "icsGoal": { const g=S.goals[t.dataset.id]; if(g&&g.due) saveIcs([goalEvent(g)], "thots-reminder.ics"); break; }
    case "addFurther": { const f=(b&&b.further||[])[+t.dataset.i]; if(f) addBook(f.title,f.author,"next",false); break; }
    case "go": location.hash="book-"+t.dataset.id; break;
    case "jump": { const el=document.getElementById(t.dataset.to); if(el) el.scrollIntoView({behavior:"smooth"}); break; }
    case "openAdd": addOpen=true; if(location.hash) location.hash=""; render(); setTimeout(()=>{ const i=$("#nb-title"); if(i){ i.focus({preventScroll:true}); i.scrollIntoView({behavior:"smooth",block:"center"}); } },30); break;
    case "closeAdd": addOpen=false; render(); break;
    case "tab": tab=t.dataset.tab; lsSet("uft-tab",tab); render(); { const p=$("#panel"); if(p && p.getBoundingClientRect().top>window.innerHeight*.8) p.scrollIntoView({behavior:"smooth"}); } break;
    case "kind": noteKind=t.dataset.k; render(); break;
    case "copy": { const bk=S.books[t.dataset.id]; if(bk) copy(chatText(bk)); break; }
    case "askDel": confirmDel=true; render(); break;
    case "noDel": confirmDel=false; render(); break;
    case "delBook": if(b){ confirmDel=false; const id=b.id; location.hash=""; safe(store.del("books",id),"Removed from the shelf."); } break;
    case "rate": if(b && t.dataset.who===me){ const n=+t.dataset.n; const cur=(b.ratings||{})[me]; safe(store.update("books",b.id,{ratings:{[me]: cur===n?0:n}})); } break;
    case "actDone": if(b){ if(needMe()) return; const i=t.dataset.i; const d=(b.done||{})[i]; safe(store.update("books",b.id,{done:{[i]: d? null : me}})); } break;
    case "goal": { const g=S.goals[t.dataset.id]; if(g){ if(needMe()) return; safe(store.update("goals",g.id,{done:!g.done, doneBy: g.done? null : me})); } break; }
    case "delGoal": safe(store.del("goals",t.dataset.id)); break;
    case "delNote": safe(store.del("notes",t.dataset.id)); break;
    case "build": { const bk=S.books[t.dataset.id]; if(bk) buildWorld(bk); break; }
  }
});
document.addEventListener("input", e=>{ const el=e.target; if(el.id && (el.tagName==="TEXTAREA"||el.tagName==="INPUT") && !el.dataset.change) drafts[el.id]=el.value; });
document.addEventListener("change", e=>{
  const el=e.target, k=el.dataset.change, b=curBook(); if(!k||!b) return;
  if(k==="status") safe(store.update("books",b.id,{status:el.value}), `Marked ${STATUS[el.value].toLowerCase()}.`);
  if(k==="meetDate") safe(store.update("books",b.id,{meetDate:el.value||null}), el.value? "Meetup saved.":"Meetup cleared.");
  if(k==="meetPlace") safe(store.update("books",b.id,{meetPlace:el.value.trim()}), "Spot saved.");
  if(k==="meetTime") safe(store.update("books",b.id,{meetTime:el.value||null}), el.value? "Check-in time saved." : "Time cleared.");
  if(k==="wkDate" && el.value){ const ws=(b.weeks||[]).map(w=>({...w})); const i=+el.dataset.i; if(ws[i]){ ws[i].date=el.value; safe(store.update("books",b.id,{weeks:ws}), `Check-in ${i+1} moved to ${fmtDay(el.value)}.`); } }
});
function clearDraft(...ids){ ids.forEach(id=>{ delete drafts[id]; const el=document.getElementById(id); if(el) el.value=""; }); }

document.addEventListener("submit", async e=>{
  const f=e.target.closest("[data-form]"); if(!f) return; e.preventDefault();
  const kind=f.dataset.form, b=curBook();
  if(kind==="addBook"){
    const title=$("#nb-title").value.trim(), author=$("#nb-author").value.trim(), status=$("#nb-status").value;
    if(!title||!author){ toast("Add a title and an author."); return; }
    const ai=$("#nb-ai")?.checked;
    addOpen=false; clearDraft("nb-title","nb-author");
    addBook(title,author,status,ai,true);
    return;
  }
  if(!b) return;
  if(kind==="answer"){
    if(needMe()) return;
    const raw=f.dataset.q, i=/^\d+$/.test(raw)? +raw : raw, tid=`ans-${b.id}-${raw}`, text=(document.getElementById(tid).value||"").trim();
    const docId=`${b.id}--q${raw}--${me}`;
    if(!text){ if(S.answers[docId]){ await safe(store.del("answers",docId),"Answer removed."); delete drafts[tid]; } return; }
    drafts[tid]=text;
    safe(store.set("answers",docId,{bookId:b.id,q:i,who:me,text,at:Date.now()}),"Posted.");
  }
  if(kind==="addQ"){
    const id=`addq-${b.id}`, q=document.getElementById(id).value.trim(); if(!q) return;
    clearDraft(id); safe(store.update("books",b.id,{questions:[...(b.questions||[]),q]}),"Question added.");
  }
  if(kind==="addAct"){
    const ti=`adda-t-${b.id}`, di=`adda-d-${b.id}`;
    const title=document.getElementById(ti).value.trim(), desc=document.getElementById(di).value.trim(); if(!title) return;
    clearDraft(ti,di); safe(store.update("books",b.id,{activities:[...(b.activities||[]),{title,desc}]}),"Activity added.");
  }
  if(kind==="note"){
    if(needMe()) return;
    const ni=`note-${b.id}`, pi=`pg-${b.id}`;
    const text=document.getElementById(ni).value.trim(), page=document.getElementById(pi).value.trim(); if(!text) return;
    clearDraft(ni,pi); safe(store.set("notes",uid(),{bookId:b.id,who:me,kind:noteKind,text,page:page||null,at:Date.now()}),"Pinned.");
  }
  if(kind==="addGoal"){
    const gi=`addg-${b.id}`, di=`addgd-${b.id}`;
    const text=document.getElementById(gi).value.trim(), due=document.getElementById(di).value; if(!text) return;
    clearDraft(gi,di); safe(store.set("goals",uid(),{bookId:b.id,text,due:due||null,done:false,who:me||null,at:Date.now()}),"Goal added.");
  }
});

async function addBook(title,author,status,ai,go){
  const id=slug(title), order=Math.max(0,...Object.values(S.books).map(x=>x.order||0))+1;
  const book={title,author,status,order,colors:PALETTES[order%PALETTES.length],questions:[],activities:[],ratings:{},done:{},addedBy:me||null,at:Date.now()};
  try{ await store.set("books",id,book); }catch(err){ safe(Promise.reject(err)); return; }
  if(go) location.hash="book-"+id;
  toast(`${title} is on the shelf${status==="next"?" as up next":""}.`);
  if(ai && sample) buildWorld({...book,id});
}
async function buildWorld(b){
  if(!sample||building) return;
  building=b.id; render();
  const prompt=`You are designing a discussion kit for "Upward Facing Thots", a book club of three close friends (Jess, Mandy and Beatriz) named after their group chat. Tone: warm, playful, a little cheeky, but the questions should be genuinely thought-provoking.

Book: "${b.title}" by ${b.author}.

Return ONLY a JSON object with exactly these keys:
- "blurb": one sentence (under 22 words) on why this book is worth arguing about.
- "questions": an array of 8 discussion questions. Reference the book's real characters, ideas and scenes. Mix deep, personal and funny.
- "activities": an array of 5 objects {"title": short name, "desc": one sentence} — things the three can do together in person or in their group chat, tied to this book.
- "goals": an array of 4 short reading-plan milestones that split the book into chunks (use real chapter or part ranges if you know them; otherwise use quarters).

If you don't know this book well, keep questions about its themes and the readers' reactions rather than inventing plot details.`;
  try{
    const v=await sample.json(prompt,{modelTier:"default"});
    const qs=Array.isArray(v?.questions)? v.questions.filter(x=>typeof x==="string").slice(0,12):[];
    const acts=Array.isArray(v?.activities)? v.activities.filter(x=>x&&x.title).map(x=>({title:String(x.title),desc:String(x.desc||"")})).slice(0,8):[];
    const gs=Array.isArray(v?.goals)? v.goals.filter(x=>typeof x==="string").slice(0,6):[];
    const fresh=S.books[b.id]||b;
    await store.update("books",b.id,{blurb: fresh.blurb || (typeof v?.blurb==="string"? v.blurb:""), questions:[...(fresh.questions||[]),...qs], activities:[...(fresh.activities||[]),...acts]});
    for(let i=0;i<gs.length;i++) await store.set("goals",uid(),{bookId:b.id,text:gs[i],due:null,done:false,who:"Claude",at:Date.now()+i});
    toast("This world is built. Dive in.");
  }catch(e){
    toast(e&&e.code==="not_granted"? "Claude isn't allowed on this page for you." : e&&e.code==="rate_limited"? "Claude needs a breather. Try again in a minute." : "Claude couldn't build it this time. Try again.");
  }finally{ building=null; render(); }
}

window.addEventListener("hashchange", ()=>{ confirmDel=false; render(); window.scrollTo(0,0); });
boot();
})();
</script>
